function removeBackground(file){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const { data, width, height } = imgData;
      const visited = new Uint8Array(width * height);
      function colorAt(x, y){ const i = (y * width + x) * 4; return [data[i], data[i+1], data[i+2]]; }
      function dist(c1, c2){ return Math.sqrt((c1[0]-c2[0])**2 + (c1[1]-c2[1])**2 + (c1[2]-c2[2])**2); }
      let rSum = 0, gSum = 0, bSum = 0, count = 0;
      for(let x = 0; x < width; x++){ [0, height-1].forEach(y=>{ const c = colorAt(x,y); rSum+=c[0]; gSum+=c[1]; bSum+=c[2]; count++; }); }
      for(let y = 0; y < height; y++){ [0, width-1].forEach(x=>{ const c = colorAt(x,y); rSum+=c[0]; gSum+=c[1]; bSum+=c[2]; count++; }); }
      const bgAvg = [rSum/count, gSum/count, bSum/count];
      const globalTolerance = 55;
      const stepTolerance = 20;
      const stack = [];
      for(let x = 0; x < width; x++){
        if(dist(colorAt(x,0), bgAvg) <= globalTolerance) stack.push([x,0,colorAt(x,0)]);
        if(dist(colorAt(x,height-1), bgAvg) <= globalTolerance) stack.push([x,height-1,colorAt(x,height-1)]);
      }
      for(let y = 0; y < height; y++){
        if(dist(colorAt(0,y), bgAvg) <= globalTolerance) stack.push([0,y,colorAt(0,y)]);
        if(dist(colorAt(width-1,y), bgAvg) <= globalTolerance) stack.push([width-1,y,colorAt(width-1,y)]);
      }
      while(stack.length){
        const [x,y,fromColor] = stack.pop();
        if(x < 0 || y < 0 || x >= width || y >= height) continue;
        const id = y * width + x;
        if(visited[id]) continue;
        const c = colorAt(x,y);
        if(dist(c, fromColor) > stepTolerance || dist(c, bgAvg) > globalTolerance) continue;
        visited[id] = 1;
        data[id*4+3] = 0;
        stack.push([x+1,y,c],[x-1,y,c],[x,y+1,c],[x,y-1,c]);
      }
      ctx.putImageData(imgData, 0, 0);
      canvas.toBlob((blob)=> resolve(blob), 'image/png');
    };
    img.onerror = ()=> resolve(null);
    img.src = URL.createObjectURL(file);
  });
}

}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const result = reader.result;
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function computeColorSeason(undertone, depth, contrast){
  if(undertone === 'warm'){
    if(depth === 'hell') return contrast === 'hoch' ? 'Klarer Frühlingstyp' : 'Frühlingstyp';
    return contrast === 'hoch' ? 'Klarer Herbsttyp' : 'Herbsttyp';
  }
  if(undertone === 'kuehl'){
    if(depth === 'dunkel' && contrast === 'hoch') return 'Wintertyp';
    return depth === 'hell' ? 'Sommertyp' : 'Weicher Sommertyp';
  }
  return depth === 'hell' ? 'Weicher Sommertyp' : 'Weicher Herbsttyp';
}
function colorMatchHint(colorText, palette){
  if(!colorText || !palette) return null;
  const lc = colorText.toLowerCase();
  const avoided = palette.avoid.find(c => lc.includes(c.toLowerCase().replace('reines ','').replace('kühles ','').replace('warmes ','')));

        <input type="password" id="auth-password" placeholder="mindestens 6 Zeichen">
        <button class="btn-primary" id="auth-submit" style="margin-bottom:10px;">Anmelden</button>
        <button class="toplink" id="auth-toggle">Noch keinen Account? Registrieren</button>
      </div>
    </div>
  `));
  let mode = "signin";
  const msg = document.getElementById('auth-msg');
  document.getElementById('auth-toggle').onclick = ()=>{
    mode = mode === "signin" ? "signup" : "signin";
    document.getElementById('auth-submit').textContent = mode === "signin" ? "Anmelden" : "Registrieren";
    document.getElementById('auth-toggle').textContent = mode === "signin" ? "Noch keinen Account? Registrieren" : "Schon registriert? Anmelden";
  };
  document.getElementById('auth-submit').onclick = async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    msg.innerHTML = "";
    if(!email || !password){ msg.appendChild(el(`<div class="msg error">Bitte E-Mail und Passwort eingeben.</div>`)); return; }
    try{
      if(mode === "signin"){ await signIn(email, password); }
      else{
        await signUp(email, password);
        msg.appendChild(el(`<div class="msg ok">Account erstellt. Falls eine Bestätigungs-Mail nötig ist, bitte den Link darin öffnen und dich danach anmelden.</div>`));
      }
    }catch(e){ msg.appendChild(el(`<div class="msg error">${e.message}</div>`)); }
  };
}

async function renderCloset(container){
  const chipsHtml = ['Alle', ...CLOTHING_CATEGORIES, 'Schmuck'].map(c=>`<span class="chip" data-cat="${c}" style="font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:999px;border:1px solid var(--hair);color:var(--ink-soft);background:var(--card);white-space:nowrap;cursor:pointer;">${c}</span>`).join('');
  container.appendChild(el(`
    <h1 class="voice">Closet</h1>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;">${chipsHtml}</div>
    <div id="closet-msg"></div>
    <div id="closet-grid" class="grid2"><p class="sub">Lädt…</p></div>
  `));
  const grid = document.getElementById('closet-grid');
  const msg = document.getElementById('closet-msg');
  let activeCat = 'Alle';
  function markActiveChip(){
    container.querySelectorAll('[data-cat]').forEach(c=>{
      const on = c.dataset.cat === activeCat;
      c.style.background = on ? 'var(--ink)' : 'var(--card)';
      c.style.borderColor = on ? 'var(--ink)' : 'var(--hair)';
      c.style.color = on ? 'var(--ivory)' : 'var(--ink-soft)';
    });
  }
  async function load(){
    grid.innerHTML = "<p class='sub'>Lädt…</p>";
    msg.innerHTML = "";
    if(activeCat === 'Schmuck'){
      const { data, error } = await sb.from('jewelry_items').select('*').order('created_at',{ascending:false});
      grid.innerHTML = "";
      if(error){ msg.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
      if(!data.length){ grid.appendChild(el(`<p class="sub">Noch kein Schmuck gespeichert – füg welchen über „Schmuck" hinzu.</p>`)); return; }
      for(const j of data){
        const url = await signedUrl(j.image_path);
        grid.appendChild(el(`<div class="swatch">${url?`<img src="${url}">`:''}<span class="tag">${j.category||''}</span></div>`));
      }
      return;
    }
    let query = sb.from('clothing_items').select('*').order('created_at',{ascending:false});
    if(activeCat !== 'Alle') query = query.eq('category', activeCat);
    const { data, error } = await query;
    grid.innerHTML = "";
    if(error){ msg.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    if(!data.length){ grid.appendChild(el(`<p class="sub">${activeCat === 'Alle' ? 'Noch keine Teile – füg über „+ Teil" dein erstes Kleidungsstück hinzu.' : 'Keine Teile in dieser Kategorie.'}</p>`)); return; }
    for(const item of data){
      const url = await signedUrl(item.image_path);
      const label = item.subcategory || item.category || 'Ohne Kategorie';
      const card = el(`<div class="swatch">${url?`<img src="${url}">`:''}<span class="tag">${label}</span><button data-edit="${item.id}" style="position:absolute;top:8px;right:38px;width:26px;height:26px;border-radius:50%;background:rgba(252,250,246,0.9);border:none;color:var(--ink);font-size:13px;line-height:1;cursor:pointer;">✎</button><button data-del="${item.id}" data-path="${item.image_path||''}" style="position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(252,250,246,0.9);border:none;color:var(--danger);font-size:15px;line-height:1;cursor:pointer;">×</button></div>`);
      grid.appendChild(card);
    }
    grid.querySelectorAll('[data-del]').forEach(b=> b.onclick = async (e)=>{
      e.stopPropagation();
      if(!confirm('Dieses Teil wirklich löschen?')) return;
      await sb.from('clothing_items').delete().eq('id', b.dataset.del);
      if(b.dataset.path) await sb.storage.from('Closet-images').remove([b.dataset.path]);
      load();
    });
    grid.querySelectorAll('[data-edit]').forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();
      editItemId = b.dataset.edit;
      currentTab = 'edititem';
      render();
    });
  }
  container.querySelectorAll('[data-cat]').forEach(c=> c.onclick = ()=>{ activeCat = c.dataset.cat; markActiveChip(); load(); });
  markActiveChip();
  load();
}

async function renderAdd(container){
  container.appendChild(el(`
    <h1 class="voice">Neues Teil</h1>
    <div id="add-msg"></div>
    <div class="card">
      <label class="f">Foto</label>
      <input type="file" id="add-file" accept="image/*">
      <div style="display:flex;align-items:center;gap:8px;margin:4px 0 10px;">
        <input type="checkbox" id="add-cleanbg" checked style="width:auto;margin:0;">
        <label class="f" style="margin:0;" for="add-cleanbg">Hintergrund automatisch bereinigen</label>
      </div>
      <div id="add-preview"></div>
      <div id="add-ai-status"></div>
      <label class="f">Kategorie</label>
      <select id="add-category">${CLOTHING_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <label class="f">Unterkategorie</label>
      <input type="text" id="add-subcategory" placeholder="z. B. Blazer, Turtleneck">
      <label class="f">Farbe</label>
      <input type="text" id="add-color" placeholder="z. B. Beige">
      <div id="add-color-hint"></div>
      <label class="f">Marke</label>
      <input type="text" id="add-brand" placeholder="optional">
      <label class="f">Material</label>
      <input type="text" id="add-material" placeholder="optional">
      <label class="f">Notizen</label>
      <textarea id="add-notes" rows="2" placeholder="optional"></textarea>
      <button class="btn-primary" id="add-save">Speichern</button>
    </div>
    <p class="sub">Die Hintergrund-Bereinigung ist eine erste, einfache Version (funktioniert am besten bei einfarbigem Hintergrund). Die KI-Vorschläge sind Einschätzungen – bitte vor dem Speichern prüfen und bei Bedarf korrigieren.</p>
  `));
  let processedBlob = null;
  let userPalette = null;
  sb.from('body_profile').select('color_season').eq('user_id', session.user.id).maybeSingle().then(({data})=>{
    if(data && data.color_season) userPalette = SEASON_PALETTES[data.color_season];
  });
  function checkColorHint(){
    const hintBox = document.getElementById('add-color-hint');
    const hint = colorMatchHint(document.getElementById('add-color').value, userPalette);
    hintBox.innerHTML = "";
    if(hint) hintBox.appendChild(el(`<p class="sub" style="color:var(--cognac);margin:-4px 0 8px;">${hint}</p>`));
  }
  document.getElementById('add-color').addEventListener('blur', checkColorHint);
  document.getElementById('add-file').onchange = async ()=>{
    processedBlob = null;
    const preview = document.getElementById('add-preview');
    const aiStatus = document.getElementById('add-ai-status');
    const file = document.getElementById('add-file').files[0];
    if(!file) { preview.innerHTML = ""; aiStatus.innerHTML = ""; return; }
    if(document.getElementById('add-cleanbg').checked){
      preview.innerHTML = `<p class="sub">Bereinige Hintergrund…</p>`;
      const blob = await removeBackground(file);
      if(blob){
        processedBlob = blob;
        preview.innerHTML = "";
        preview.appendChild(el(`<div class="swatch" style="height:180px;margin-bottom:10px;"><img src="${URL.createObjectURL(blob)}" style="background:repeating-conic-gradient(#e7dac7 0% 25%, transparent 0% 50%) 50% / 16px 16px;"></div>`));
      } else {
        preview.innerHTML = `<p class="sub">Bereinigung nicht möglich, Original wird verwendet.</p>`;
      }
    } else {
      preview.innerHTML = "";
    }
    aiStatus.innerHTML = `<p class="sub">KI erkennt das Kleidungsstück…</p>`;
    const guess = await recognizeItem(file);
    if(!guess){
      aiStatus.innerHTML = `<p class="sub">KI-Erkennung aktuell nicht verfügbar – bitte Angaben manuell eintragen.</p>`;
      return;
    }
    if(guess.category && CLOTHING_CATEGORIES.includes(guess.category)){
      document.getElementById('add-category').value = guess.category;
    }
    if(guess.subcategory) document.getElementById('add-subcategory').value = guess.subcategory;
    if(guess.colors && guess.colors.length) document.getElementById('add-color').value = guess.colors.join(', ');
    if(guess.brand_guess) document.getElementById('add-brand').value = guess.brand_guess;
    if(guess.material) document.getElementById('add-material').value = guess.material;
    checkColorHint();
    const unsure = guess.confidence === 'unsicher';
    aiStatus.innerHTML = "";
    aiStatus.appendChild(el(`<div class="msg ${unsure?'error':'ok'}" style="${unsure?'background:#F6EEDD;color:#8A6420;':''}">
      ${unsure?'Vermutung, nicht sicher':'KI-Vorschlag übernommen'} – bitte prüfen und bei Bedarf korrigieren.${guess.style?' Stil: '+guess.style+'.':''}
    </div>`));
  };
  document.getElementById('add-save').onclick = async ()=>{
    const msg = document.getElementById('add-msg'); msg.innerHTML = "";
    const btn = document.getElementById('add-save'); btn.disabled = true; btn.textContent = "Speichert…";
    try{
      const file = document.getElementById('add-file').files[0];
      let image_path = null;
      if(file){
        const useProcessed = document.getElementById('add-cleanbg').checked && processedBlob;
        const uploadBlob = useProcessed ? processedBlob : file;
        const ext = useProcessed ? 'png' : (file.name.split('.').pop() || 'jpg');
        const path = `${session.user.id}/${crypto.randomUUID()}.${ext}`;
        const { error: upErr } = await sb.storage.from('Closet-images').upload(path, uploadBlob, { contentType: useProcessed ? 'image/png' : file.type });
        if(upErr) throw upErr;
        image_path = path;
      }
      const { error } = await sb.from('clothing_items').insert({
        user_id: session.user.id,
        image_path,
        category: document.getElementById('add-category').value || null,
        subcategory: document.getElementById('add-subcategory').value || null,
        colors: document.getElementById('add-color').value ? [document.getElementById('add-color').value] : null,
        brand: document.getElementById('add-brand').value || null,
        material: document.getElementById('add-material').value || null,
        notes: document.getElementById('add-notes').value || null
      });
      if(error) throw error;
      currentTab = "closet"; render();
    }catch(e){
      msg.appendChild(el(`<div class="msg error">${e.message}</div>`));
      btn.disabled = false; btn.textContent = "Speichern";
    }
  };
}

  document.getElementById('bp-save').onclick = async ()=>{
    const msg = document.getElementById('bp-msg'); msg.innerHTML = "";

      user_id: session.user.id,

  };

  /* Statur-Auswahl */
  const buildRow = document.getElementById('build-row');
  let selectedBuild = (bp && bp.body_build) || 'normal';
  function markBuilds(){
    buildRow.querySelectorAll('[data-build]').forEach(b=>{
      const on = b.dataset.build === selectedBuild;
      b.style.background = on ? 'var(--ink)' : 'var(--card)';
      b.style.borderColor = on ? 'var(--ink)' : 'var(--hair)';
      b.style.color = on ? 'var(--ivory)' : 'var(--ink-soft)';
    });
  }
  BODY_BUILDS.forEach(build=>{
    buildRow.appendChild(el(`<span data-build="${build.id}" style="font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:999px;border:1px solid var(--hair);color:var(--ink-soft);background:var(--card);white-space:nowrap;cursor:pointer;flex:none;">${build.label}</span>`));
  });

  /* Körperform-Auswahl */
  const shapeGrid = document.getElementById('shape-grid');
  const shapeTips = document.getElementById('shape-tips');
  const shapeSelected = document.getElementById('shape-selected');
  let selectedShape = bp && bp.body_shape || null;
  function renderShapeTips(){
    const shape = BODY_SHAPES.find(s=>s.id===selectedShape);
    if(!shape){ shapeSelected.textContent = "Noch keine Auswahl."; shapeTips.innerHTML = ""; return; }
    shapeSelected.textContent = `${shape.label} – ${shape.desc}`;
    shapeTips.innerHTML = "";
    shapeTips.appendChild(el(`<div class="msg ok" style="line-height:1.5;">${shape.tips.map(t=>'• '+t).join('<br>')}</div>`));
  }
  function markShapes(){
    shapeGrid.querySelectorAll('[data-shape]').forEach(b=>{
      const on = b.dataset.shape === selectedShape;
      b.style.borderColor = on ? 'var(--cognac)' : 'var(--hair)';
      b.style.background = on ? 'var(--sand)' : 'var(--card)';
    });
  }
  function buildScale(){
    const b = BODY_BUILDS.find(x=>x.id===selectedBuild);
    return b ? b.scale : 1;
  }
  function renderShapeGrid(){
    shapeGrid.innerHTML = "";
    BODY_SHAPES.forEach(shape=>{
      const btn = el(`<button data-shape="${shape.id}" style="border:1.5px solid var(--hair);background:var(--card);border-radius:12px;padding:6px 2px 4px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;">
        ${bodyShapeSvg(shape.w, buildScale())}<span style="font-size:10.5px;color:var(--ink-soft);text-align:center;line-height:1.2;">${shape.label}</span>
      </button>`);
      shapeGrid.appendChild(btn);
    });
    shapeGrid.querySelectorAll('[data-shape]').forEach(b=> b.onclick = async ()=>{
      selectedShape = b.dataset.shape;
      markShapes(); renderShapeTips();
      if(typeof renderStyleCard === 'function') renderStyleCard();
      await sb.from('body_profile').upsert({ user_id: session.user.id, body_shape: selectedShape, updated_at: new Date().toISOString() });
    });
    markShapes();
  }
  buildRow.querySelectorAll('[data-build]').forEach(b=> b.onclick = async ()=>{
    selectedBuild = b.dataset.build;
    markBuilds();
    renderShapeGrid();
    if(typeof renderStyleCard === 'function') renderStyleCard();
    await sb.from('body_profile').upsert({ user_id: session.user.id, body_build: selectedBuild, updated_at: new Date().toISOString() });
  });
  markBuilds();
  renderShapeGrid();
  renderShapeTips();

  /* Farbtyp – visuelle Auswahl */
  let selectedSkin = (bp && bp.skin_tone_id) || null;
  let selectedHair = (bp && bp.hair_color_id) || null;
  let selectedEye = (bp && bp.eye_color) || null;
  let currentSeason = (bp && bp.color_season) || null;

  function swatchRow(rowId, items, selectedId, onPick){
    const row = document.getElementById(rowId);
    row.innerHTML = "";
    items.forEach(item=>{
      const btn = el(`<button data-id="${item.id}" title="${item.label}" style="border:none;background:none;cursor:pointer;padding:2px;display:flex;flex-direction:column;align-items:center;gap:4px;width:56px;">
        <span style="display:block;border-radius:50%;padding:2px;border:2px solid ${item.id===selectedId?'var(--cognac)':'transparent'};">${swatchCircle(item)}</span>
        <span style="font-size:9.5px;color:var(--ink-soft);text-align:center;line-height:1.15;">${item.label}</span>
      </button>`);
      row.appendChild(btn);
    });
    row.querySelectorAll('[data-id]').forEach(b=> b.onclick = ()=> onPick(b.dataset.id));
  }
  function drawSkinRow(){ swatchRow('skin-row', SKIN_TONES, selectedSkin, (id)=>{ selectedSkin = id; drawSkinRow(); }); }
  function drawHairRow(){ swatchRow('hair-row', HAIR_COLORS, selectedHair, (id)=>{ selectedHair = id; drawHairRow(); }); }
  function drawEyeRow(){ swatchRow('eye-row', EYE_COLORS, selectedEye, (id)=>{ selectedEye = id; drawEyeRow(); }); }
  drawSkinRow(); drawHairRow(); drawEyeRow();

  function renderStyleCard(){
    const wrap = document.getElementById('style-card-wrap');
    wrap.innerHTML = "";
    if(!currentSeason && !selectedShape) return;
    const palette = currentSeason ? SEASON_PALETTES[currentSeason] : null;
    const shape = selectedShape ? BODY_SHAPES.find(s=>s.id===selectedShape) : null;
    const build = BODY_BUILDS.find(b=>b.id===selectedBuild);
    let html = `<div class="card" style="background:linear-gradient(160deg,var(--card),var(--sand) 220%);border-color:var(--taupe);">
      <h2 class="voice" style="font-size:17px;margin-bottom:2px;">Deine Style-Karte</h2>`;
    if(shape){
      html += `<p class="sub" style="margin:6px 0 2px;">Körperform</p>
        <p style="margin:0 0 10px;font-size:14px;font-weight:500;">${shape.label}${build?' · '+build.label:''}</p>`;
    }
    if(palette){
      html += `<p class="sub" style="margin:6px 0 2px;">Farbtyp</p>
        <p style="margin:0 0 6px;font-size:14px;font-weight:500;">${currentSeason} · Schmuck: ${palette.metal}</p>
        <p class="sub" style="margin:0 0 4px;">Diese Farben stehen dir besonders gut</p>
        <div style="margin-bottom:8px;">${palette.recommended.map(colorDot).join('')}</div>
        <p class="sub" style="margin:0 0 4px;">Eher zurückhaltend einsetzen</p>
        <div style="margin-bottom:8px;">${palette.avoid.map(colorDot).join('')}</div>`;
    }
    if(shape){
      html += `<p class="sub" style="margin:10px 0 4px;">Style-Tipps für deine Form</p>
        <p style="margin:0;font-size:13px;line-height:1.6;">${shape.tips.map(t=>'• '+t).join('<br>')}</p>`;
    }
    html += `</div>`;
    wrap.appendChild(el(html));
  }
  renderStyleCard();

  document.getElementById('ct-save').onclick = async ()=>{
    if(!selectedSkin || !selectedHair){
      alert('Bitte mindestens Hautton und Haarfarbe auswählen.');
      return;
    }
    const skin = SKIN_TONES.find(s=>s.id===selectedSkin);
    const hair = HAIR_COLORS.find(h=>h.id===selectedHair);
    const depthLabel = DEPTH_LABELS[hair.depth];
    const contrast = contrastFromDepths(skin.depth, hair.depth);
    currentSeason = computeColorSeason(skin.undertone, depthLabel, contrast);
    renderStyleCard();
    await sb.from('body_profile').upsert({
      user_id: session.user.id,
      skin_undertone: skin.undertone,
      hair_depth: depthLabel,
      contrast_level: contrast,
      color_season: currentSeason,
      skin_tone_id: selectedSkin,
      hair_color_id: selectedHair,
      eye_color: selectedEye,
      updated_at: new Date().toISOString()
    });
  };

  document.getElementById('signout').onclick = signOut;
}

      if(bp.body_shape){
        const shape = BODY_SHAPES.find(s=>s.id===bp.body_shape);
        const build = BODY_BUILDS.find(b=>b.id===bp.body_build);
        if(shape) context.body_shape = { label: shape.label, style_tips: shape.tips, build: build ? build.label : null };
      }
      if(bp.color_season && SEASON_PALETTES[bp.color_season]){
        context.color_type = { season: bp.color_season, ...SEASON_PALETTES[bp.color_season] };
      }
    }
  }catch(e){ console.error('buildChatContext', e); }
  return context;
}
async function renderChat(container){
  container.appendChild(el(`
    ${backLink()}
    <h1 class="voice" style="font-size:22px;">Deine Stylistin</h1>
    <p class="sub">Deine persönliche KI-Stylistin kennt deinen Kleiderschrank, Termine, das Wetter und deinen gespeicherten Stil.</p>
    <div id="chat-list"></div>
    <div style="height:70px;"></div>
    <div style="position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:8px;">
      <input type="text" id="chat-input" placeholder="Schreib deiner Stylistin" style="flex:1;">
      <button class="btn-primary" id="chat-send" style="width:44px;padding:0;">↑</button>
    </div>
  `));
  async function load(){
    const list = document.getElementById('chat-list');
    const { data, error } = await sb.from('chat_messages').select('*').order('created_at',{ascending:true});
    list.innerHTML = "";
    if(error){ list.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    data.forEach(m=>{
      const bubble = m.role === 'user'
        ? `<div style="display:flex;justify-content:flex-end;margin-bottom:8px;"><div class="card" style="background:var(--sand);border:none;max-width:80%;"><p style="margin:0;font-size:13.5px;">${m.content}</p></div></div>`
        : `<div style="display:flex;gap:8px;margin-bottom:8px;"><div style="width:26px;height:26px;border-radius:50%;background:var(--cognac);flex:none;"></div><div class="card" style="max-width:80%;"><p style="margin:0;font-size:13.5px;">${m.content}</p></div></div>`;
      list.appendChild(el(bubble));
    });
    list.scrollIntoView({block:'end'});
  }
  bindBack();
  document.getElementById('chat-send').onclick = async ()=>{
    const input = document.getElementById('chat-input');
    const btn = document.getElementById('chat-send');
    const text = input.value.trim();
    if(!text) return;
    input.value = "";
    btn.disabled = true;
    await sb.from('chat_messages').insert({ user_id: session.user.id, role: 'user', content: text });
    await load();
    try{
      const { data: history } = await sb.from('chat_messages').select('role,content').order('created_at',{ascending:true}).limit(20);
      const messages = (history||[]).map(m=>({ role: m.role, content: m.content }));
      const context = await buildChatContext();
      const { data, error } = await sb.functions.invoke('ai-chat', { body: { messages, context } });
      if(error) throw error;
      if(data && data.error) throw new Error(data.error);
      const reply = (data && data.reply) || 'Entschuldige, mir fällt gerade keine Antwort ein. Magst du es nochmal anders formulieren?';
      await sb.from('chat_messages').insert({ user_id: session.user.id, role: 'assistant', content: reply });
    }catch(e){
      console.error('ai-chat', e);
      await sb.from('chat_messages').insert({ user_id: session.user.id, role: 'assistant', content: 'Deine Nachricht ist gespeichert, aber die KI-Antwort ist gerade nicht erreichbar. Versuch es gleich nochmal.' });
    }
    btn.disabled = false;
    load();
  };
  load();
}

async function renderApp(){
  app.innerHTML = "";
  const container = document.createElement('div');
  app.appendChild(container);
  if(currentTab === 'home') await renderHome(container);
  else if(currentTab === 'closet') await renderCloset(container);
  else if(currentTab === 'add') await renderAdd(container);
  else if(currentTab === 'edititem') await renderEditItem(container);
  else if(currentTab === 'calendar') await renderCalendar(container);
  else if(currentTab === 'profile') await renderProfile(container);
  else if(currentTab === 'wishlist') await renderWishlist(container);
  else if(currentTab === 'inspiration') await renderInspiration(container);
  else if(currentTab === 'diary') await renderDiary(container);
  else if(currentTab === 'jewelry') await renderJewelry(container);
  else if(currentTab === 'mystyle') await renderMyStyle(container);
  else if(currentTab === 'chat') await renderChat(container);
  app.appendChild(el(navBar()));
  bindNav();
}

async function render(){
  if(!session){ renderAuthView(); return; }
  await renderApp();
}

initAuth();
</script>
