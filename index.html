<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kleiderschrank</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap');
:root{
  --ivory:#F6F0E6; --card:#FCFAF6; --sand:#E7DAC7; --taupe:#A6896A;
  --cognac:#6B3B24; --ink:#2B2019; --ink-soft:#7A6E62; --hair:#E1D3BE;
  --danger:#A3372D;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ivory);font-family:'Inter',sans-serif;color:var(--ink);}
.voice{font-family:'Fraunces',serif;}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 100px;min-height:100vh;position:relative;}
h1.voice{font-size:24px;font-weight:400;margin:0 0 4px;}
h2.voice{font-size:18px;font-weight:500;margin:0 0 8px;}
.sub{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;margin-bottom:14px;}
input,select,textarea{
  width:100%;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:11px 13px;margin-bottom:10px;
}
label.f{font-size:12px;color:var(--ink-soft);display:block;margin:0 0 4px;}
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;background:var(--cognac);color:#F6EDE4;
  border:none;border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;
  padding:13px 18px;cursor:pointer;width:100%;
}
.btn-primary:disabled{opacity:.6;cursor:default;}
.btn-secondary{
  display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);
  border:1px solid var(--taupe);border-radius:12px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
  padding:10px 16px;cursor:pointer;width:100%;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.swatch{border-radius:14px;background:var(--sand);position:relative;overflow:hidden;height:150px;}
.swatch img{width:100%;height:100%;object-fit:cover;display:block;}
.tag{position:absolute;left:8px;bottom:8px;font-size:11.5px;font-weight:500;color:var(--ink);background:rgba(252,250,246,0.88);padding:3px 8px;border-radius:999px;}
.navbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;
  background:var(--card);border-top:1px solid var(--hair);padding:10px 6px calc(10px + env(safe-area-inset-bottom));}
.navitem{background:none;border:none;font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}
.navitem.active{color:var(--cognac);font-weight:500;}
.view{display:none;}
.view.active{display:block;}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:10px;}
.msg.error{background:#F6E3E0;color:var(--danger);}
.msg.ok{background:#E9EFDD;color:#4B6B1D;}
.toplink{background:none;border:none;color:var(--cognac);font-size:13px;font-weight:500;cursor:pointer;padding:0;}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13.5px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Supabase-Verbindung ---------- */
const SUPABASE_URL = "https://edunnmorjsnwtsoynyar.supabase.co";
const SUPABASE_KEY = "sb_publishable_MfFprGy4xWHCWww4e9i6tA_TLAuX8wk";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null;
let currentTab = "home";
const app = document.getElementById("app");

/* ---------- Hilfsfunktionen ---------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function fmtDate(d){ return new Date(d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}); }
async function signedUrl(path){
  if(!path) return null;
  const { data, error } = await sb.storage.from('Closet-images').createSignedUrl(path, 3600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}

/* ---------- Auth ---------- */
async function initAuth(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, newSession)=>{ session = newSession; render(); });
  render();
}

async function signUp(email, password){
  const { error } = await sb.auth.signUp({ email, password });
  if(error) throw error;
}
async function signIn(email, password){
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
}
async function signOut(){ await sb.auth.signOut(); }

/* ---------- Views ---------- */
function renderAuthView(){
  app.innerHTML = "";
  app.appendChild(el(`
    <div style="padding-top:60px;">
      <h1 class="voice" style="text-align:center;">Dein Kleiderschrank</h1>
      <p class="sub" style="text-align:center;">Melde dich an, um fortzufahren</p>
      <div class="card">
        <div id="auth-msg"></div>
        <label class="f">E-Mail</label>
        <input type="email" id="auth-email" placeholder="du@beispiel.de">
        <label class="f">Passwort</label>
        <input type="password" id="auth-password" placeholder="mindestens 6 Zeichen">
        <button class="btn-primary" id="auth-submit" style="margin-bottom:10px;">Anmelden</button>
        <button class="toplink" id="auth-toggle">Noch keinen Account? Registrieren</button>
      </div>
    </div>
  `));
  let mode = "signin";
  const msg = document.getElementById('auth-msg');
  document.getElementById('auth-toggle').onclick = ()=>{
    mode = mode === "signin" ? "signup" : "signin";
    document.getElementById('auth-submit').textContent = mode === "signin" ? "Anmelden" : "Registrieren";
    document.getElementById('auth-toggle').textContent = mode === "signin" ? "Noch keinen Account? Registrieren" : "Schon registriert? Anmelden";
  };
  document.getElementById('auth-submit').onclick = async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    msg.innerHTML = "";
    if(!email || !password){ msg.appendChild(el(`<div class="msg error">Bitte E-Mail und Passwort eingeben.</div>`)); return; }
    try{
      if(mode === "signin"){ await signIn(email, password); }
      else{
        await signUp(email, password);
        msg.appendChild(el(`<div class="msg ok">Account erstellt. Falls eine Bestätigungs-Mail nötig ist, bitte den Link darin öffnen und dich danach anmelden.</div>`));
      }
    }catch(e){ msg.appendChild(el(`<div class="msg error">${e.message}</div>`)); }
  };
}

function navBar(){
  return `
  <div class="navbar">
    <button class="navitem ${currentTab==='home'?'active':''}" data-tab="home">Home</button>
    <button class="navitem ${currentTab==='closet'?'active':''}" data-tab="closet">Closet</button>
    <button class="navitem ${currentTab==='add'?'active':''}" data-tab="add">+ Teil</button>
    <button class="navitem ${currentTab==='calendar'?'active':''}" data-tab="calendar">Kalender</button>
    <button class="navitem ${currentTab==='profile'?'active':''}" data-tab="profile">Profil</button>
  </div>`;
}
function bindNav(){
  document.querySelectorAll('.navitem').forEach(b=>{
    b.onclick = ()=>{ currentTab = b.dataset.tab; render(); };
  });
}

async function renderHome(container){
  const { data: events } = await sb.from('events').select('*').gte('event_date', new Date().toISOString().slice(0,10)).order('event_date',{ascending:true}).limit(1);
  const { count } = await sb.from('clothing_items').select('*', {count:'exact', head:true});
  let nextEventHtml = `<p class="sub">Keine bevorstehenden Events – trag eins im Kalender ein.</p>`;
  if(events && events.length){
    const e = events[0];
    nextEventHtml = `<p style="margin:0;font-size:14px;font-weight:500;">${e.title}</p><p class="sub" style="margin:4px 0 0;">${fmtDate(e.event_date)}${e.event_time?', '+e.event_time.slice(0,5)+' Uhr':''}${e.location? ' · '+e.location:''}</p>`;
  }
  container.appendChild(el(`
    <h1 class="voice">Guten Morgen ✨</h1>
    <p class="sub">${count||0} Teile in deinem Closet</p>
    <div class="card"><h2 class="voice" style="font-size:15px;">Nächstes Event</h2>${nextEventHtml}</div>
    <div class="grid2">
      <button class="btn-secondary" data-goto="closet">Closet ansehen</button>
      <button class="btn-secondary" data-goto="add">Teil hinzufügen</button>
    </div>
  `));
  container.querySelectorAll('[data-goto]').forEach(b=> b.onclick = ()=>{ currentTab = b.dataset.goto; render(); });
}

async function renderCloset(container){
  container.appendChild(el(`<h1 class="voice">Closet</h1><div id="closet-msg"></div><div id="closet-grid" class="grid2"><p class="sub">Lädt…</p></div>`));
  const { data, error } = await sb.from('clothing_items').select('*').order('created_at',{ascending:false});
  const grid = document.getElementById('closet-grid');
  grid.innerHTML = "";
  if(error){ document.getElementById('closet-msg').appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
  if(!data.length){ grid.appendChild(el(`<p class="sub">Noch keine Teile – füg über „+ Teil" dein erstes Kleidungsstück hinzu.</p>`)); return; }
  for(const item of data){
    const url = await signedUrl(item.image_path);
    const card = el(`<div class="swatch">${url?`<img src="${url}">`:''}<span class="tag">${item.category||'Ohne Kategorie'}</span></div>`);
    grid.appendChild(card);
  }
}

async function renderAdd(container){
  container.appendChild(el(`
    <h1 class="voice">Neues Teil</h1>
    <div id="add-msg"></div>
    <div class="card">
      <label class="f">Foto</label>
      <input type="file" id="add-file" accept="image/*">
      <label class="f">Kategorie</label>
      <input type="text" id="add-category" placeholder="z. B. Mantel">
      <label class="f">Farbe</label>
      <input type="text" id="add-color" placeholder="z. B. Beige">
      <label class="f">Marke</label>
      <input type="text" id="add-brand" placeholder="optional">
      <label class="f">Material</label>
      <input type="text" id="add-material" placeholder="optional">
      <label class="f">Notizen</label>
      <textarea id="add-notes" rows="2" placeholder="optional"></textarea>
      <button class="btn-primary" id="add-save">Speichern</button>
    </div>
    <p class="sub">Die automatische KI-Erkennung von Kategorie/Farbe/Material ist noch nicht angebunden – bis dahin trägst du die Angaben hier manuell ein.</p>
  `));
  document.getElementById('add-save').onclick = async ()=>{
    const msg = document.getElementById('add-msg'); msg.innerHTML = "";
    const btn = document.getElementById('add-save'); btn.disabled = true; btn.textContent = "Speichert…";
    try{
      const file = document.getElementById('add-file').files[0];
      let image_path = null;
      if(file){
        const path = `${session.user.id}/${crypto.randomUUID()}-${file.name}`;
        const { error: upErr } = await sb.storage.from('Closet-images').upload(path, file);
        if(upErr) throw upErr;
        image_path = path;
      }
      const { error } = await sb.from('clothing_items').insert({
        user_id: session.user.id,
        image_path,
        category: document.getElementById('add-category').value || null,
        colors: document.getElementById('add-color').value ? [document.getElementById('add-color').value] : null,
        brand: document.getElementById('add-brand').value || null,
        material: document.getElementById('add-material').value || null,
        notes: document.getElementById('add-notes').value || null
      });
      if(error) throw error;
      currentTab = "closet"; render();
    }catch(e){
      msg.appendChild(el(`<div class="msg error">${e.message}</div>`));
      btn.disabled = false; btn.textContent = "Speichern";
    }
  };
}

async function renderCalendar(container){
  container.appendChild(el(`
    <h1 class="voice">Kalender</h1>
    <div id="cal-msg"></div>
    <div class="card">
      <label class="f">Titel</label>
      <input type="text" id="ev-title" placeholder="z. B. Geburtstag im Weingut">
      <div class="grid2">
        <div><label class="f">Datum</label><input type="date" id="ev-date"></div>
        <div><label class="f">Uhrzeit</label><input type="time" id="ev-time"></div>
      </div>
      <label class="f">Ort</label>
      <input type="text" id="ev-location" placeholder="optional">
      <label class="f">Dresscode</label>
      <input type="text" id="ev-dresscode" placeholder="optional">
      <button class="btn-primary" id="ev-save">Event hinzufügen</button>
    </div>
    <div id="ev-list"></div>
  `));
  async function loadEvents(){
    const list = document.getElementById('ev-list');
    list.innerHTML = "<p class='sub'>Lädt…</p>";
    const { data, error } = await sb.from('events').select('*').order('event_date',{ascending:true});
    list.innerHTML = "";
    if(error){ list.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    if(!data.length){ list.appendChild(el(`<p class="sub">Noch keine Events eingetragen.</p>`)); return; }
    data.forEach(e=>{
      list.appendChild(el(`<div class="rowline"><span>${e.title}</span><span>${fmtDate(e.event_date)}${e.event_time?', '+e.event_time.slice(0,5):''}</span></div>`));
    });
  }
  document.getElementById('ev-save').onclick = async ()=>{
    const msg = document.getElementById('cal-msg'); msg.innerHTML = "";
    const title = document.getElementById('ev-title').value.trim();
    const date = document.getElementById('ev-date').value;
    if(!title || !date){ msg.appendChild(el(`<div class="msg error">Bitte mindestens Titel und Datum angeben.</div>`)); return; }
    const { error } = await sb.from('events').insert({
      user_id: session.user.id,
      title,
      event_date: date,
      event_time: document.getElementById('ev-time').value || null,
      location: document.getElementById('ev-location').value || null,
      dress_code: document.getElementById('ev-dresscode').value || null
    });
    if(error){ msg.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    document.getElementById('ev-title').value = "";
    document.getElementById('ev-date').value = "";
    document.getElementById('ev-time').value = "";
    document.getElementById('ev-location').value = "";
    document.getElementById('ev-dresscode').value = "";
    loadEvents();
  };
  loadEvents();
}

async function renderProfile(container){
  container.appendChild(el(`
    <h1 class="voice">Profil</h1>
    <p class="sub">${session.user.email}</p>
    <div id="bp-msg"></div>
    <div class="card">
      <h2 class="voice" style="font-size:15px;">Körperprofil</h2>
      <label class="f">Größe (cm)</label>
      <input type="number" id="bp-height" placeholder="z. B. 168">
      <label class="f">Konfektionsgröße Oberteile</label>
      <input type="text" id="bp-top" placeholder="z. B. M">
      <label class="f">Konfektionsgröße Hosen</label>
      <input type="text" id="bp-bottom" placeholder="z. B. 38">
      <label class="f">Schuhgröße</label>
      <input type="text" id="bp-shoe" placeholder="z. B. 39">
      <button class="btn-primary" id="bp-save">Speichern</button>
    </div>
    <button class="btn-secondary" id="signout">Abmelden</button>
  `));
  const { data: bp } = await sb.from('body_profile').select('*').eq('user_id', session.user.id).maybeSingle();
  if(bp){
    document.getElementById('bp-height').value = bp.height_cm || '';
    document.getElementById('bp-top').value = bp.top_size || '';
    document.getElementById('bp-bottom').value = bp.bottom_size || '';
    document.getElementById('bp-shoe').value = bp.shoe_size || '';
  }
  document.getElementById('bp-save').onclick = async ()=>{
    const msg = document.getElementById('bp-msg'); msg.innerHTML = "";
    const { error } = await sb.from('body_profile').upsert({
      user_id: session.user.id,
      height_cm: document.getElementById('bp-height').value || null,
      top_size: document.getElementById('bp-top').value || null,
      bottom_size: document.getElementById('bp-bottom').value || null,
      shoe_size: document.getElementById('bp-shoe').value || null,
      updated_at: new Date().toISOString()
    });
    if(error){ msg.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    msg.appendChild(el(`<div class="msg ok">Gespeichert.</div>`));
  };
  document.getElementById('signout').onclick = signOut;
}

async function renderApp(){
  app.innerHTML = "";
  const container = el(`<div></div>`);
  app.appendChild(container);
  if(currentTab === 'home') await renderHome(container);
  else if(currentTab === 'closet') await renderCloset(container);
  else if(currentTab === 'add') await renderAdd(container);
  else if(currentTab === 'calendar') await renderCalendar(container);
  else if(currentTab === 'profile') await renderProfile(container);
  app.appendChild(el(navBar()));
  bindNav();
}

async function render(){
  if(!session){ renderAuthView(); return; }
  await renderApp();
}

initAuth();
</script>
</body>
</html>
