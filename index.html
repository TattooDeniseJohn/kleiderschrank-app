<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap');
:root{
  --ivory:#F6F0E6; --card:#FCFAF6; --sand:#E7DAC7; --taupe:#A6896A;
  --cognac:#6B3B24; --ink:#2B2019; --ink-soft:#7A6E62; --hair:#E1D3BE;
  --danger:#A3372D;
  --gold:#C9A227; --gold-light:#F0D998; --gold-deep:#8A6A14;
  --gold-grad:linear-gradient(135deg,#F7E7B0,#C9A227 45%,#8A6A14 75%,#D4AF37);
}
*{box-sizing:border-box;}
html{background:var(--ivory);}
body{margin:0;background:var(--ivory);font-family:'Inter',sans-serif;color:var(--ink);overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;}
.voice{font-family:'Fraunces',serif;}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 100px;min-height:100vh;position:relative;}
h1.voice{font-size:24px;font-weight:400;margin:0 0 4px;}
h2.voice{font-size:18px;font-weight:500;margin:0 0 8px;}
.sub{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;margin-bottom:14px;}
input,select,textarea{
  width:100%;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:11px 13px;margin-bottom:10px;
}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;border-radius:5px;flex:none;}
label.f{font-size:12px;color:var(--ink-soft);display:block;margin:0 0 4px;}
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;background:var(--cognac);color:#F6EDE4;
  border:1.5px solid var(--gold);border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;
  padding:12.5px 18px;cursor:pointer;width:100%;box-shadow:0 1px 8px rgba(201,162,39,0.25);
}
.btn-primary:disabled{opacity:.6;cursor:default;}
.btn-secondary{
  display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);
  border:1px solid var(--taupe);border-radius:12px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
  padding:10px 16px;cursor:pointer;width:100%;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.swatch{border-radius:14px;background:var(--sand);position:relative;overflow:hidden;height:150px;}
.swatch img{width:100%;height:100%;object-fit:cover;display:block;}
.tag{position:absolute;left:8px;bottom:8px;font-size:11.5px;font-weight:500;color:var(--ink);background:rgba(252,250,246,0.88);padding:3px 8px;border-radius:999px;}
.navbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;
  background:var(--card);border-top:1px solid var(--hair);padding:10px 6px calc(10px + env(safe-area-inset-bottom));}
.navitem{background:none;border:none;font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}
.navitem.active{color:var(--cognac);font-weight:500;position:relative;}
.navitem.active::after{content:'';position:absolute;left:50%;bottom:-2px;width:4px;height:4px;border-radius:50%;background:var(--gold);transform:translateX(-50%);}
.view{display:none;}
.view.active{display:block;}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:10px;}
.msg.error{background:#F6E3E0;color:var(--danger);}
.msg.ok{background:#E9EFDD;color:#4B6B1D;}
.toplink{background:none;border:none;color:var(--cognac);font-size:13px;font-weight:500;cursor:pointer;padding:0;}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-badge{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 1px 4px rgba(0,0,0,0.15);}
.brand-row{display:flex;align-items:center;gap:10px;justify-content:center;}

.rowline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13.5px;}
</style>
</head>

function loadFileToCanvas(file, maxDim){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, (maxDim||1000) / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width*scale));
      canvas.height = Math.max(1, Math.round(img.height*scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas);
    };
    img.onerror = ()=> resolve(null);
    img.src = URL.createObjectURL(file);
  });
}
function colorDist(c1, c2){ return Math.sqrt((c1[0]-c2[0])**2 + (c1[1]-c2[1])**2 + (c1[2]-c2[2])**2); }
function autoCleanCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const { width, height } = canvas;
  const imgData = ctx.getImageData(0, 0, width, height);
  const { data } = imgData;
  const visited = new Uint8Array(width * height);
  function colorAt(x, y){ const i = (y * width + x) * 4; return [data[i], data[i+1], data[i+2]]; }
  let rSum=0, gSum=0, bSum=0, count=0;
  for(let x=0; x<width; x++){ [0, height-1].forEach(y=>{ const c=colorAt(x,y); rSum+=c[0]; gSum+=c[1]; bSum+=c[2]; count++; }); }
  for(let y=0; y<height; y++){ [0, width-1].forEach(x=>{ const c=colorAt(x,y); rSum+=c[0]; gSum+=c[1]; bSum+=c[2]; count++; }); }
  const bgAvg = [rSum/count, gSum/count, bSum/count];
  const globalTolerance = 55, stepTolerance = 20;
  const stack = [];
  for(let x=0; x<width; x++){
    if(colorDist(colorAt(x,0), bgAvg) <= globalTolerance) stack.push([x,0,colorAt(x,0)]);
    if(colorDist(colorAt(x,height-1), bgAvg) <= globalTolerance) stack.push([x,height-1,colorAt(x,height-1)]);
  }
  for(let y=0; y<height; y++){
    if(colorDist(colorAt(0,y), bgAvg) <= globalTolerance) stack.push([0,y,colorAt(0,y)]);
    if(colorDist(colorAt(width-1,y), bgAvg) <= globalTolerance) stack.push([width-1,y,colorAt(width-1,y)]);
  }
  while(stack.length){
    const [x,y,fromColor] = stack.pop();
    if(x<0||y<0||x>=width||y>=height) continue;
    const id = y*width+x;
    if(visited[id]) continue;
    const c = colorAt(x,y);
    if(colorDist(c, fromColor) > stepTolerance || colorDist(c, bgAvg) > globalTolerance) continue;
    visited[id] = 1;
    data[id*4+3] = 0;
    stack.push([x+1,y,c],[x-1,y,c],[x,y+1,c],[x,y-1,c]);
  }
  ctx.putImageData(imgData, 0, 0);
}
function eraseFromPoint(canvas, x, y, tolerance){
  const ctx = canvas.getContext('2d');
  const { width, height } = canvas;
  if(x<0||y<0||x>=width||y>=height) return;
  const imgData = ctx.getImageData(0, 0, width, height);
  const { data } = imgData;
  function colorAt(px, py){ const i = (py*width+px)*4; return [data[i], data[i+1], data[i+2]]; }
  const target = colorAt(x, y);
  const visited = new Uint8Array(width * height);
  const stack = [[x,y]];
  const tol = tolerance || 42;
  while(stack.length){
    const [cx,cy] = stack.pop();
    if(cx<0||cy<0||cx>=width||cy>=height) continue;
    const id = cy*width+cx;
    if(visited[id]) continue;
    const c = colorAt(cx,cy);
    if(colorDist(c, target) > tol) continue;
    visited[id] = 1;
    data[id*4+3] = 0;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}
async function fetchWeather(){
  try{
    const pos = await new Promise((res, rej)=> navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
    const { latitude, longitude } = pos.coords;
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,precipitation_probability&timezone=auto`);
    const j = await r.json();
    return { temp: Math.round(j.current.temperature_2m), rain: j.current.precipitation_probability, place: `${latitude.toFixed(2)}, ${longitude.toFixed(2)}` };
  }catch(e){ return null; }
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const result = reader.result;
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function contrastFromDepths(skinDepth, hairDepth){
  const diff = Math.abs(skinDepth - hairDepth);
  return diff <= 0 ? 'niedrig' : (diff === 1 ? 'mittel' : 'hoch');
}
function swatchCircle(item, size){
  const s = size || 34;
  return `<span style="width:${s}px;height:${s}px;border-radius:50%;display:block;background:${item.css};border:1.5px solid rgba(0,0,0,0.12);"></span>`;
}
function eyeSwatch(item, size){
  const s = size || 46;
  const irisFill = item.css.startsWith('linear-gradient') ? `url(#grad-${item.id})` : item.css;
  const gradDef = item.css.startsWith('linear-gradient')
    ? `<defs><linearGradient id="grad-${item.id}" x1="0" y1="0" x2="1" y2="1">${item.css.replace('linear-gradient(135deg,','').replace(')','').split(',').map((c,i,arr)=>`<stop offset="${(i/(arr.length-1)*100).toFixed(0)}%" stop-color="${c.trim()}"/>`).join('')}</linearGradient></defs>`
    : '';
  return `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
    ${gradDef}
    <ellipse cx="30" cy="30" rx="28" ry="18" fill="#FBF7F0" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="${irisFill}"/>
    <circle cx="30" cy="30" r="6.5" fill="#151210"/>
    <circle cx="26" cy="26" r="2.6" fill="#fff" opacity="0.85"/>
  </svg>`;
}

function avatarSvg(opts){
  const { shape, buildScale, skin, hair, eye, hairStyleId, eyelashId, lipColorId, noseId, bangsId, nosePiercing } = opts;
  const scaleF = buildScale || 1;
  const w = shape.w;
  const cx=60, scale=38*scaleF;
  const sh=cx-w.shoulders*scale, shR=cx+w.shoulders*scale;
  const bu=cx-w.bust*scale*0.95, buR=cx+w.bust*scale*0.95;
  const wa=cx-w.waist*scale*0.8, waR=cx+w.waist*scale*0.8;
  const hi=cx-w.hips*scale*0.9, hiR=cx+w.hips*scale*0.9;
  const kn=cx-18*Math.min(scaleF,1.15), knR=cx+18*Math.min(scaleF,1.15);
  const bodyPath = `M ${sh} 35 C ${bu} 45, ${bu} 58, ${bu} 68 C ${wa} 80, ${wa} 90, ${wa} 98 C ${hi} 110, ${hi} 120, ${hi} 130 C ${hi+6} 158, ${kn} 188, ${kn} 214 L ${knR} 214 C ${knR} 188, ${hiR-6} 158, ${hiR} 130 C ${hiR} 120, ${hiR} 110, ${waR} 98 C ${waR} 90, ${waR} 80, ${buR} 68 C ${buR} 58, ${buR} 45, ${shR} 35 Z`;
  const skinHex = skin ? skin.css : '#E8C6A0';
  const hairHex = hair ? (hair.css.startsWith('linear-gradient') ? '#8A6338' : hair.css) : '#6E4626';
  const hairstyle = HAIRSTYLES.find(h=>h.id===hairStyleId) || HAIRSTYLES[2];
  const bangs = HAIR_BANGS.find(b=>b.id===bangsId) || HAIR_BANGS[0];
  const nose = NOSE_SHAPES.find(n=>n.id===noseId) || NOSE_SHAPES[1];
  const lash = EYELASH_STYLES.find(l=>l.id===eyelashId) || EYELASH_STYLES[0];
  const lip = LIP_COLORS.find(l=>l.id===lipColorId) || LIP_COLORS[0];
  const lipHex = lip.hex || '#C48A6D';
  const irisFill = eye ? (eye.css.startsWith('linear-gradient') ? `url(#avatar-grad-eye)` : eye.css) : '#6E4626';
  const gradDef = (eye && eye.css.startsWith('linear-gradient'))
    ? `<defs><linearGradient id="avatar-grad-eye" x1="0" y1="0" x2="1" y2="1">${eye.css.replace('linear-gradient(135deg,','').replace(')','').split(',').map((c,i,arr)=>`<stop offset="${(i/(arr.length-1)*100).toFixed(0)}%" stop-color="${c.trim()}"/>`).join('')}</linearGradient></defs>`
    : '';
  return `<svg viewBox="0 0 120 220" width="260" height="477" fill="none">
    ${gradDef}
    <path d="${bodyPath}" fill="${skinHex}" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
    <circle cx="60" cy="14" r="11" fill="${skinHex}" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
    <path d="M ${cx-5} 24 L ${cx-5} 33 M ${cx+5} 24 L ${cx+5} 33" stroke="${skinHex}" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="55.5" cy="13" rx="2.3" ry="1.5" fill="#fff"/>
    <circle cx="55.5" cy="13" r="1.15" fill="${irisFill}"/>
    <circle cx="55.5" cy="13" r="0.5" fill="#111"/>
    <ellipse cx="64.5" cy="13" rx="2.3" ry="1.5" fill="#fff"/>
    <circle cx="64.5" cy="13" r="1.15" fill="${irisFill}"/>
    <circle cx="64.5" cy="13" r="0.5" fill="#111"/>
    <path d="M53.3 11.6 L${(53.3-lash.len*0.4).toFixed(2)} ${(11.6-lash.len*0.5).toFixed(2)}" stroke="#241a12" stroke-width="${lash.w*0.5}" stroke-linecap="round"/>
    <path d="M57.7 11.6 L${(57.7+lash.len*0.4).toFixed(2)} ${(11.6-lash.len*0.5).toFixed(2)}" stroke="#241a12" stroke-width="${lash.w*0.5}" stroke-linecap="round"/>
    <path d="M62.3 11.6 L${(62.3-lash.len*0.4).toFixed(2)} ${(11.6-lash.len*0.5).toFixed(2)}" stroke="#241a12" stroke-width="${lash.w*0.5}" stroke-linecap="round"/>
    <path d="M66.7 11.6 L${(66.7+lash.len*0.4).toFixed(2)} ${(11.6-lash.len*0.5).toFixed(2)}" stroke="#241a12" stroke-width="${lash.w*0.5}" stroke-linecap="round"/>
    <g fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="0.5" stroke-linecap="round">${nose.nose}</g>
    <path d="M56.5 20.5 Q60 22.2 63.5 20.5 Q60 23 56.5 20.5 Z" fill="${lipHex}"/>
    ${nosePiercing ? '<circle cx="61.8" cy="17.6" r="0.75" fill="none" stroke="#D4AF37" stroke-width="0.45"/>' : ''}
    ${hairstyle.hair(hairHex)}
    <path d="M53.3 10.3 Q55.5 9.1 57.5 10.1" stroke="#3a2a1a" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
    <path d="M62.5 10.1 Q64.5 9.1 66.7 10.3" stroke="#3a2a1a" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
    ${bangs.bangs(hairHex)}
  </svg>`;
}
function swatchRow(rowId, items, selectedId, onPick, opts){
  const row = document.getElementById(rowId);
  row.innerHTML = "";
  const size = (opts && opts.size) || 34;
  const isEye = opts && opts.eye;
  items.forEach(item=>{
    const btn = el(`<button data-id="${item.id}" title="${item.label}" style="border:none;background:none;cursor:pointer;padding:2px;display:flex;flex-direction:column;align-items:center;gap:4px;width:${size+22}px;">
      <span style="display:block;border-radius:50%;padding:3px;border:2px solid ${item.id===selectedId?'var(--cognac)':'transparent'};">${isEye?eyeSwatch(item,size):swatchCircle(item,size)}</span>
      <span style="font-size:9.5px;color:var(--ink-soft);text-align:center;line-height:1.15;">${item.label}</span>
    </button>`);
    row.appendChild(btn);
  });
  row.querySelectorAll('[data-id]').forEach(b=> b.onclick = ()=> onPick(b.dataset.id));
}
function computeColorSeason(undertone, depth, contrast){
  if(undertone === 'warm'){
    if(depth === 'hell') return contrast === 'hoch' ? 'Klarer Frühlingstyp' : 'Frühlingstyp';
    return contrast === 'hoch' ? 'Klarer Herbsttyp' : 'Herbsttyp';
  }
  if(undertone === 'kuehl'){
    if(depth === 'dunkel' && contrast === 'hoch') return 'Wintertyp';
    return depth === 'hell' ? 'Sommertyp' : 'Weicher Sommertyp';
  }
  return depth === 'hell' ? 'Weicher Sommertyp' : 'Weicher Herbsttyp';
}
function colorMatchHint(colorText, palette){
  if(!colorText || !palette) return null;
  const lc = colorText.toLowerCase();
  const avoided = palette.avoid.find(c => lc.includes(c.toLowerCase().replace('reines ','').replace('kühles ','').replace('warmes ','')));
  if(avoided) return `Hinweis: ${avoided} gehört eher zu den Farben, die dir laut deinem Farbtyp weniger stehen – kombiniert mit einer deiner Empfehlungsfarben kann es trotzdem funktionieren.`;
  return null;
}
async function recognizeItem(file){
  try{
    const base64 = await fileToBase64(file);
    const { data, error } = await sb.functions.invoke('ai-recognize', { body: { image_base64: base64, mime: file.type || 'image/jpeg' } });
    if(error) throw error;
    if(data && data.error) throw new Error(data.error);
    return data;
  }catch(e){ console.error('recognizeItem', e); return null; }
}
function backLink(){
  return `<div class="backrow" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;"><button class="toplink" id="back-home" style="font-size:20px;">←</button><span class="sub" style="margin:0;">Zurück</span></div>`;
}
function bindBack(target){
  const b = document.getElementById('back-home');
  if(b) b.onclick = ()=>{ currentTab = target || 'home'; render(); };
}
async function signedUrl(path){
  if(!path) return null;
  const { data, error } = await sb.storage.from('Closet-images').createSignedUrl(path, 3600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}

/* ---------- Auth ---------- */
async function initAuth(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, newSession)=>{ session = newSession; render(); });
  render();
}

async function signUp(email, password){
  const { error } = await sb.auth.signUp({ email, password });
  if(error) throw error;
}
async function signIn(email, password){
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
}
async function signOut(){ await sb.auth.signOut(); }

        <input type="email" id="auth-email" placeholder="du@beispiel.de">

        <input type="password" id="auth-password" placeholder="mindestens 6 Zeichen">

        <button class="toplink" id="auth-toggle">Noch keinen Account? Registrieren</button>
      </div>
    </div>
  `));
  let mode = "signin";

  document.getElementById('auth-toggle').onclick = ()=>{
    mode = mode === "signin" ? "signup" : "signin";
    document.getElementById('auth-submit').textContent = mode === "signin" ? "Anmelden" : "Registrieren";
    document.getElementById('auth-toggle').textContent = mode === "signin" ? "Noch keinen Account? Registrieren" : "Schon registriert? Anmelden";
  };
  document.getElementById('auth-submit').onclick = async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    msg.innerHTML = "";
    if(!email || !password){ msg.appendChild(el(`<div class="msg error">Bitte E-Mail und Passwort eingeben.</div>`)); return; }

      if(mode === "signin"){ await signIn(email, password); }
      else{
        await signUp(email, password);
        msg.appendChild(el(`<div class="msg ok">Account erstellt. Falls eine Bestätigungs-Mail nötig ist, bitte den Link darin öffnen und dich danach anmelden.</div>`));

    }catch(e){ msg.appendChild(el(`<div class="msg error">${e.message}</div>`)); }
  };

async function renderCloset(container){
  const chipsHtml = ['Alle', ...CLOTHING_CATEGORIES, 'Schmuck'].map(c=>`<span class="chip" data-cat="${c}" style="font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:999px;border:1px solid var(--hair);color:var(--ink-soft);background:var(--card);white-space:nowrap;cursor:pointer;">${c}</span>`).join('');
  container.appendChild(el(`
    <h1 class="voice">Closet</h1>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;">${chipsHtml}</div>
    <div id="closet-msg"></div>
    <div id="closet-grid" class="grid2"><p class="sub">Lädt…</p></div>
  `));
  const grid = document.getElementById('closet-grid');
  const msg = document.getElementById('closet-msg');
  let activeCat = 'Alle';
  function markActiveChip(){
    container.querySelectorAll('[data-cat]').forEach(c=>{
      const on = c.dataset.cat === activeCat;
      c.style.background = on ? 'var(--ink)' : 'var(--card)';
      c.style.borderColor = on ? 'var(--ink)' : 'var(--hair)';
      c.style.color = on ? 'var(--ivory)' : 'var(--ink-soft)';
    });
  }
  async function load(){
    grid.innerHTML = "<p class='sub'>Lädt…</p>";
    msg.innerHTML = "";
    if(activeCat === 'Schmuck'){
      const { data, error } = await sb.from('jewelry_items').select('*').order('created_at',{ascending:false});
      grid.innerHTML = "";
      if(error){ msg.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
      if(!data.length){ grid.appendChild(el(`<p class="sub">Noch kein Schmuck gespeichert – füg welchen über „Schmuck" hinzu.</p>`)); return; }
      for(const j of data){
        const url = await signedUrl(j.image_path);
        grid.appendChild(el(`<div class="swatch">${url?`<img src="${url}">`:''}<span class="tag">${j.category||''}</span></div>`));
      }
      return;
    }
    let query = sb.from('clothing_items').select('*').order('created_at',{ascending:false});
    if(activeCat !== 'Alle') query = query.eq('category', activeCat);
    const { data, error } = await query;
    grid.innerHTML = "";
    if(error){ msg.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    if(!data.length){ grid.appendChild(el(`<p class="sub">${activeCat === 'Alle' ? 'Noch keine Teile – füg über „+ Teil" dein erstes Kleidungsstück hinzu.' : 'Keine Teile in dieser Kategorie.'}</p>`)); return; }
    for(const item of data){
      const url = await signedUrl(item.image_path);
      const label = item.subcategory || item.category || 'Ohne Kategorie';
      const card = el(`<div class="swatch">${url?`<img src="${url}">`:''}<span class="tag">${label}</span><button data-edit="${item.id}" style="position:absolute;top:8px;right:38px;width:26px;height:26px;border-radius:50%;background:rgba(252,250,246,0.9);border:none;color:var(--ink);font-size:13px;line-height:1;cursor:pointer;">✎</button><button data-del="${item.id}" data-path="${item.image_path||''}" style="position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(252,250,246,0.9);border:none;color:var(--danger);font-size:15px;line-height:1;cursor:pointer;">×</button></div>`);
      grid.appendChild(card);
    }
    grid.querySelectorAll('[data-del]').forEach(b=> b.onclick = async (e)=>{
      e.stopPropagation();
      if(!confirm('Dieses Teil wirklich löschen?')) return;
      await sb.from('clothing_items').delete().eq('id', b.dataset.del);
      if(b.dataset.path) await sb.storage.from('Closet-images').remove([b.dataset.path]);
      load();
    });
    grid.querySelectorAll('[data-edit]').forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();
      editItemId = b.dataset.edit;
      currentTab = 'edititem';
      render();
    });
  }
  container.querySelectorAll('[data-cat]').forEach(c=> c.onclick = ()=>{ activeCat = c.dataset.cat; markActiveChip(); load(); });
  markActiveChip();
  load();
}

async function renderAdd(container){
  container.appendChild(el(`
    <h1 class="voice">Neues Teil</h1>
    <div id="add-msg"></div>
    <div class="card">
      <label class="f">Foto</label>
      <input type="file" id="add-file" accept="image/*">
      <div style="display:flex;align-items:center;gap:8px;margin:4px 0 10px;">
        <input type="checkbox" id="add-cleanbg" checked style="width:auto;margin:0;">
        <label class="f" style="margin:0;" for="add-cleanbg">Hintergrund automatisch bereinigen</label>
      </div>
      <div id="add-preview"></div>
      <div id="add-ai-status"></div>
      <label class="f">Kategorie</label>
      <select id="add-category">${CLOTHING_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <label class="f">Unterkategorie</label>
      <input type="text" id="add-subcategory" placeholder="z. B. Blazer, Turtleneck">
      <label class="f">Farbe</label>
      <input type="text" id="add-color" placeholder="z. B. Beige">
      <div id="add-color-hint"></div>
      <label class="f">Marke</label>
      <input type="text" id="add-brand" placeholder="optional">
      <label class="f">Material</label>
      <input type="text" id="add-material" placeholder="optional">
      <label class="f">Notizen</label>
      <textarea id="add-notes" rows="2" placeholder="optional"></textarea>
      <button class="btn-primary" id="add-save">Speichern</button>
    </div>
    <p class="sub">Die automatische Bereinigung funktioniert am besten bei einfarbigem Hintergrund. Bleibt danach noch etwas übrig, einfach im Bild darauftippen, um es wegzuradieren. Die KI-Vorschläge sind Einschätzungen – bitte vor dem Speichern prüfen und bei Bedarf korrigieren.</p>
  `));
  let originalCanvas = null;
  let workCanvas = null;
  let userPalette = null;
  sb.from('body_profile').select('color_season').eq('user_id', session.user.id).maybeSingle().then(({data})=>{
    if(data && data.color_season) userPalette = SEASON_PALETTES[data.color_season];
  });
  function checkColorHint(){
    const hintBox = document.getElementById('add-color-hint');
    const hint = colorMatchHint(document.getElementById('add-color').value, userPalette);
    hintBox.innerHTML = "";
    if(hint) hintBox.appendChild(el(`<p class="sub" style="color:var(--cognac);margin:-4px 0 8px;">${hint}</p>`));
  }
  document.getElementById('add-color').addEventListener('blur', checkColorHint);
  function showPreviewCanvas(){
    const preview = document.getElementById('add-preview');
    preview.innerHTML = "";
    const wrap = el(`<div style="border-radius:14px;overflow:hidden;background:repeating-conic-gradient(#e7dac7 0% 25%, transparent 0% 50%) 50% / 16px 16px;margin-bottom:6px;line-height:0;"></div>`);
    preview.appendChild(wrap);
    const wrapEl = preview.firstElementChild;
    workCanvas.style.width = '100%';
    workCanvas.style.height = 'auto';
    workCanvas.style.display = 'block';
    workCanvas.style.cursor = 'crosshair';
    wrapEl.appendChild(workCanvas);
    preview.appendChild(el(`<p class="sub" style="margin:0 0 6px;">Noch Hintergrund übrig? Einfach draufttippen, um ihn wegzuradieren.</p>`));
    preview.appendChild(el(`<button type="button" class="btn-secondary" id="add-reset-bg" style="margin-bottom:10px;">Zurücksetzen</button>`));
    document.getElementById('add-reset-bg').onclick = ()=>{
      const ctx = workCanvas.getContext('2d');
      ctx.clearRect(0,0,workCanvas.width,workCanvas.height);
      ctx.drawImage(originalCanvas,0,0);
      if(document.getElementById('add-cleanbg').checked) autoCleanCanvas(workCanvas);
    };
    workCanvas.onclick = (evt)=>{
      const rect = workCanvas.getBoundingClientRect();
      const x = Math.floor((evt.clientX - rect.left) * (workCanvas.width / rect.width));
      const y = Math.floor((evt.clientY - rect.top) * (workCanvas.height / rect.height));
      eraseFromPoint(workCanvas, x, y, 42);
    };
  }
  document.getElementById('add-cleanbg').onchange = ()=>{
    if(!originalCanvas) return;
    const ctx = workCanvas.getContext('2d');
    ctx.clearRect(0,0,workCanvas.width,workCanvas.height);
    ctx.drawImage(originalCanvas,0,0);
    if(document.getElementById('add-cleanbg').checked) autoCleanCanvas(workCanvas);
  };
  document.getElementById('add-file').onchange = async ()=>{
    originalCanvas = null; workCanvas = null;
    const preview = document.getElementById('add-preview');
    const aiStatus = document.getElementById('add-ai-status');
    const file = document.getElementById('add-file').files[0];
    if(!file) { preview.innerHTML = ""; aiStatus.innerHTML = ""; return; }
    preview.innerHTML = `<p class="sub">Bild wird geladen…</p>`;
    originalCanvas = await loadFileToCanvas(file, 1000);
    if(!originalCanvas){
      preview.innerHTML = `<p class="sub">Foto konnte nicht geladen werden.</p>`;
    } else {
      workCanvas = document.createElement('canvas');
      workCanvas.width = originalCanvas.width;
      workCanvas.height = originalCanvas.height;
      workCanvas.getContext('2d').drawImage(originalCanvas,0,0);
      if(document.getElementById('add-cleanbg').checked) autoCleanCanvas(workCanvas);
      showPreviewCanvas();
    }
    aiStatus.innerHTML = `<p class="sub">KI erkennt das Kleidungsstück…</p>`;
    const guess = await recognizeItem(file);
    if(!guess){
      aiStatus.innerHTML = `<p class="sub">KI-Erkennung aktuell nicht verfügbar – bitte Angaben manuell eintragen.</p>`;
      return;
    }
    if(guess.category && CLOTHING_CATEGORIES.includes(guess.category)){
      document.getElementById('add-category').value = guess.category;
    }
    if(guess.subcategory) document.getElementById('add-subcategory').value = guess.subcategory;
    if(guess.colors && guess.colors.length) document.getElementById('add-color').value = guess.colors.join(', ');
    if(guess.brand_guess) document.getElementById('add-brand').value = guess.brand_guess;
    if(guess.material) document.getElementById('add-material').value = guess.material;
    checkColorHint();
    const unsure = guess.confidence === 'unsicher';
    aiStatus.innerHTML = "";
    aiStatus.appendChild(el(`<div class="msg ${unsure?'error':'ok'}" style="${unsure?'background:#F6EEDD;color:#8A6420;':''}">
      ${unsure?'Vermutung, nicht sicher':'KI-Vorschlag übernommen'} – bitte prüfen und bei Bedarf korrigieren.${guess.style?' Stil: '+guess.style+'.':''}
    </div>`));
  };
  document.getElementById('add-save').onclick = async ()=>{
    const msg = document.getElementById('add-msg'); msg.innerHTML = "";
    const btn = document.getElementById('add-save'); btn.disabled = true; btn.textContent = "Speichert…";
    try{
      const file = document.getElementById('add-file').files[0];
      let image_path = null;
      if(file){
        let uploadBlob, ext, contentType;
        if(workCanvas){
          uploadBlob = await new Promise(res=> workCanvas.toBlob(res, 'image/png'));
          ext = 'png'; contentType = 'image/png';
        } else {
          uploadBlob = file; ext = file.name.split('.').pop() || 'jpg'; contentType = file.type;
        }
        const path = `${session.user.id}/${crypto.randomUUID()}.${ext}`;
        const { error: upErr } = await sb.storage.from('Closet-images').upload(path, uploadBlob, { contentType });
        if(upErr) throw upErr;
        image_path = path;
      }
      const { error } = await sb.from('clothing_items').insert({
        user_id: session.user.id,
        image_path,
        category: document.getElementById('add-category').value || null,
        subcategory: document.getElementById('add-subcategory').value || null,
        colors: document.getElementById('add-color').value ? [document.getElementById('add-color').value] : null,
        brand: document.getElementById('add-brand').value || null,
        material: document.getElementById('add-material').value || null,
        notes: document.getElementById('add-notes').value || null
      });
      if(error) throw error;
      currentTab = "closet"; render();
    }catch(e){
      msg.appendChild(el(`<div class="msg error">${e.message}</div>`));
      btn.disabled = false; btn.textContent = "Speichern";
    }
  };
}

      <p class="sub">Körperform beschreibt die Proportionen (wo Schulter, Taille, Hüfte im Verhältnis zueinander liegen) – unabhängig davon, ob du schlank oder kräftig bist. Eine Sanduhrfigur bleibt eine Sanduhrfigur, in jeder Statur.</p>
      <div id="shape-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px;"></div>

    </div>
    <div class="card">
      <h2 class="voice" style="font-size:15px;">Farbtyp</h2>
      <p class="sub">Foto hochladen und die KI schlägt Hautton, Haar- und Augenfarbe vor – oder direkt unten auswählen. Für das Foto: unbearbeitet, bei Tageslicht, Gesicht/Haare gleichmäßig beleuchtet. Alles danach frei korrigierbar.</p>

    </div>
    <div id="style-card-wrap"></div>
    <button class="btn-secondary" id="goto-avatar" style="margin-bottom:14px;">Deinen Avatar erstellen / bearbeiten →</button>
    <button class="btn-secondary" id="signout">Abmelden</button>
  `));
  document.getElementById('goto-avatar').onclick = ()=>{ currentTab = 'avatar'; render(); };
  const { data: bp } = await sb.from('body_profile').select('*').eq('user_id', session.user.id).maybeSingle();
  if(bp){
    document.getElementById('bp-height').value = bp.height_cm || '';
    document.getElementById('bp-top').value = bp.top_size || '';
    document.getElementById('bp-bottom').value = bp.bottom_size || '';

  }
  document.getElementById('bp-save').onclick = async ()=>{
    const msg = document.getElementById('bp-msg'); msg.innerHTML = "";
    const { error } = await sb.from('body_profile').upsert({
      user_id: session.user.id,
      height_cm: document.getElementById('bp-height').value || null,
      top_size: document.getElementById('bp-top').value || null,
      bottom_size: document.getElementById('bp-bottom').value || null,
      shoe_size: document.getElementById('bp-shoe').value || null,
      updated_at: new Date().toISOString()
    });
    if(error){ msg.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    msg.appendChild(el(`<div class="msg ok">Gespeichert.</div>`));
  };

  /* Statur-Auswahl */
  const buildRow = document.getElementById('build-row');
  let selectedBuild = (bp && bp.body_build) || 'normal';
  function markBuilds(){
    buildRow.querySelectorAll('[data-build]').forEach(b=>{
      const on = b.dataset.build === selectedBuild;
      b.style.background = on ? 'var(--ink)' : 'var(--card)';
      b.style.borderColor = on ? 'var(--ink)' : 'var(--hair)';
      b.style.color = on ? 'var(--ivory)' : 'var(--ink-soft)';
    });
  }
  BODY_BUILDS.forEach(build=>{
    buildRow.appendChild(el(`<span data-build="${build.id}" style="font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:999px;border:1px solid var(--hair);color:var(--ink-soft);background:var(--card);white-space:nowrap;cursor:pointer;flex:none;">${build.label}</span>`));
  });

  /* Körperform-Auswahl */
  const shapeGrid = document.getElementById('shape-grid');
  const shapeTips = document.getElementById('shape-tips');
  const shapeSelected = document.getElementById('shape-selected');
  let selectedShape = bp && bp.body_shape || null;
  function renderShapeTips(){
    const shape = BODY_SHAPES.find(s=>s.id===selectedShape);
    if(!shape){ shapeSelected.textContent = "Noch keine Auswahl."; shapeTips.innerHTML = ""; return; }
    shapeSelected.textContent = `${shape.label} – ${shape.desc}`;
    shapeTips.innerHTML = "";
    shapeTips.appendChild(el(`<div class="msg ok" style="line-height:1.5;">${shape.tips.map(t=>'• '+t).join('<br>')}</div>`));
  }
  function markShapes(){
    shapeGrid.querySelectorAll('[data-shape]').forEach(b=>{
      const on = b.dataset.shape === selectedShape;
      b.style.borderColor = on ? 'var(--cognac)' : 'var(--hair)';
      b.style.background = on ? 'var(--sand)' : 'var(--card)';
    });
  }
  function buildScale(){
    const b = BODY_BUILDS.find(x=>x.id===selectedBuild);
    return b ? b.scale : 1;
  }
  function renderShapeGrid(){
    shapeGrid.innerHTML = "";
    BODY_SHAPES.forEach(shape=>{
      const btn = el(`<button data-shape="${shape.id}" style="border:1.5px solid var(--hair);background:var(--card);border-radius:12px;padding:6px 2px 4px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;">
        ${bodyShapeSvg(shape, buildScale())}<span style="font-size:10.5px;color:var(--ink-soft);text-align:center;line-height:1.2;">${shape.label}</span>
      </button>`);
      shapeGrid.appendChild(btn);
    });
    shapeGrid.querySelectorAll('[data-shape]').forEach(b=> b.onclick = async ()=>{
      selectedShape = b.dataset.shape;
      markShapes(); renderShapeTips();
      if(typeof renderStyleCard === 'function') renderStyleCard();
      await sb.from('body_profile').upsert({ user_id: session.user.id, body_shape: selectedShape, updated_at: new Date().toISOString() });
    });
    markShapes();
  }
  buildRow.querySelectorAll('[data-build]').forEach(b=> b.onclick = async ()=>{
    selectedBuild = b.dataset.build;
    markBuilds();
    renderShapeGrid();
    if(typeof renderStyleCard === 'function') renderStyleCard();
    await sb.from('body_profile').upsert({ user_id: session.user.id, body_build: selectedBuild, updated_at: new Date().toISOString() });
  });
  markBuilds();
  renderShapeGrid();
  renderShapeTips();

  /* Farbtyp – visuelle Auswahl */
  let selectedSkin = (bp && bp.skin_tone_id) || null;
  let selectedHair = (bp && bp.hair_color_id) || null;
  let selectedEye = (bp && bp.eye_color) || null;
  let currentSeason = (bp && bp.color_season) || null;

  function drawSkinRow(){ swatchRow('skin-row', SKIN_TONES, selectedSkin, (id)=>{ selectedSkin = id; drawSkinRow(); }, {size:38}); }
  function drawHairRow(){ swatchRow('hair-row', HAIR_COLORS, selectedHair, (id)=>{ selectedHair = id; drawHairRow(); }, {size:44}); }
  function drawEyeRow(){ swatchRow('eye-row', EYE_COLORS, selectedEye, (id)=>{ selectedEye = id; drawEyeRow(); }, {size:44, eye:true}); }
  drawSkinRow(); drawHairRow(); drawEyeRow();

  document.getElementById('ct-file').onchange = async ()=>{
    const file = document.getElementById('ct-file').files[0];
    const status = document.getElementById('ct-ai-status');
    const photoPreview = document.getElementById('ct-photo-preview');
    if(!file) return;
    photoPreview.innerHTML = "";
    photoPreview.appendChild(el(`<div style="width:132px;height:132px;border-radius:50%;overflow:hidden;margin:10px auto 6px;border:3px solid var(--card);box-shadow:0 0 0 1px var(--hair);"><img src="${URL.createObjectURL(file)}" style="width:100%;height:100%;object-fit:cover;"></div>`));
    status.innerHTML = `<p class="sub">KI analysiert das Foto…</p>`;
    try{
      const base64 = await fileToBase64(file);
      const { data, error } = await sb.functions.invoke('ai-color-analysis', { body: { image_base64: base64, mime: file.type || 'image/jpeg' } });
      if(error) throw error;
      if(data && data.error) throw new Error(data.error);
      if(data.skin_tone_id && SKIN_TONES.find(s=>s.id===data.skin_tone_id)) selectedSkin = data.skin_tone_id;
      if(data.hair_color_id && HAIR_COLORS.find(h=>h.id===data.hair_color_id)) selectedHair = data.hair_color_id;
      if(data.eye_color && EYE_COLORS.find(e=>e.id===data.eye_color)) selectedEye = data.eye_color;
      drawSkinRow(); drawHairRow(); drawEyeRow();
      const unsure = data.confidence === 'unsicher';
      status.innerHTML = "";
      status.appendChild(el(`<div class="msg ${unsure?'error':'ok'}" style="${unsure?'background:#F6EEDD;color:#8A6420;':''}">${unsure?'Vermutung, nicht sicher':'KI-Vorschlag übernommen'} – bitte prüfen, unten sind alle Farben frei wählbar.</div>`));
    }catch(e){
      console.error('ai-color-analysis', e);
      status.innerHTML = `<p class="sub">KI-Erkennung gerade nicht verfügbar – bitte unten manuell auswählen.</p>`;
    }
  };

  function renderStyleCard(){
    const wrap = document.getElementById('style-card-wrap');
    wrap.innerHTML = "";
    if(!currentSeason && !selectedShape) return;
    const palette = currentSeason ? SEASON_PALETTES[currentSeason] : null;
    const shape = selectedShape ? BODY_SHAPES.find(s=>s.id===selectedShape) : null;
    const build = BODY_BUILDS.find(b=>b.id===selectedBuild);
    let html = `<div class="card" style="background:linear-gradient(160deg,var(--card),var(--sand) 220%);border-color:var(--taupe);">
      <h2 class="voice" style="font-size:17px;margin-bottom:2px;">Deine Style-Karte</h2>`;
    if(shape){
      html += `<p class="sub" style="margin:6px 0 2px;">Körperform</p>
        <p style="margin:0 0 10px;font-size:14px;font-weight:500;">${shape.label}${build?' · '+build.label:''}</p>`;
    }
    if(palette){
      const skin = selectedSkin && SKIN_TONES.find(s=>s.id===selectedSkin);
      const hair = selectedHair && HAIR_COLORS.find(h=>h.id===selectedHair);
      const eye = selectedEye && EYE_COLORS.find(e=>e.id===selectedEye);
      const contrast = (bp && bp.contrast_level) || (skin && hair ? contrastFromDepths(skin.depth, hair.depth) : null);
      html += `<p class="sub" style="margin:6px 0 2px;">Farbtyp</p>
        <p style="margin:0 0 2px;font-size:16px;font-weight:500;">${currentSeason}</p>
        <p class="sub" style="margin:0 0 10px;">${palette.attrs || ''}</p>`;
      if(skin || hair || eye){
        html += `<p class="sub" style="margin:0 0 10px;">${eye?'Augen: '+eye.label+' · ':''}${hair?'Haare: '+hair.label+' · ':''}${skin?'Haut: '+skin.label:''}</p>`;
      }
      if(contrast){
        html += `<p class="sub" style="margin:0 0 12px;line-height:1.5;"><strong>Kontrast: ${contrast}.</strong> ${CONTRAST_EXPLAIN}</p>`;
      }
      html += `<p class="f" style="margin-bottom:4px;">Diese Farben stehen dir besonders gut</p>
        <div style="margin-bottom:10px;">${palette.recommended.map(colorDot).join('')}</div>
        <p class="f" style="margin-bottom:4px;">Eher zurückhaltend einsetzen</p>
        <div style="margin-bottom:10px;">${palette.avoid.map(colorDot).join('')}</div>
        <p class="f" style="margin-bottom:4px;">Make-up-Töne</p>
        <div style="margin-bottom:10px;">${(palette.makeup||[]).map(colorDot).join('')}</div>
        <p class="f" style="margin-bottom:4px;">Schmuck</p>
        <p class="sub" style="margin:0 0 4px;">${palette.metal}</p>`;
    }
    if(shape){
      html += `<p class="sub" style="margin:10px 0 4px;">Style-Tipps für deine Form</p>
        <p style="margin:0;font-size:13px;line-height:1.6;">${shape.tips.map(t=>'• '+t).join('<br>')}</p>`;
    }
    html += `</div>`;
    wrap.appendChild(el(html));
  }
  renderStyleCard();

  document.getElementById('ct-save').onclick = async ()=>{
    if(!selectedSkin || !selectedHair){
      alert('Bitte mindestens Hautton und Haarfarbe auswählen.');
      return;
    }
    const skin = SKIN_TONES.find(s=>s.id===selectedSkin);
    const hair = HAIR_COLORS.find(h=>h.id===selectedHair);
    const depthLabel = DEPTH_LABELS[hair.depth];
    const contrast = contrastFromDepths(skin.depth, hair.depth);
    currentSeason = computeColorSeason(skin.undertone, depthLabel, contrast);
    renderStyleCard();
    await sb.from('body_profile').upsert({
      user_id: session.user.id,
      skin_undertone: skin.undertone,
      hair_depth: depthLabel,
      contrast_level: contrast,
      color_season: currentSeason,
      skin_tone_id: selectedSkin,
      hair_color_id: selectedHair,
      eye_color: selectedEye,
      updated_at: new Date().toISOString()
    });
  };

  document.getElementById('signout').onclick = signOut;
}

async function renderAvatar(container){
  container.appendChild(el(`
    ${backLink()}
    <h1 class="voice">Dein Avatar</h1>

    <div class="card" style="margin-top:14px;">
      <h2 class="voice" style="font-size:15px;">Outfit durchswipen</h2>
      <p class="sub">Pro Kategorie durch deine Teile wischen oder mit den Pfeilen blättern – die Auswahl erscheint direkt oben auf der Figur.</p>
      <div id="av-outfit-sections"></div>
    </div>
  `));
  bindBack('profile');

  const { data: bp } = await sb.from('body_profile').select('*').eq('user_id', session.user.id).maybeSingle();
  const { data: jewelryRaw } = await sb.from('jewelry_items').select('*').order('created_at',{ascending:false});
  const jewelryItems = jewelryRaw || [];
  const { data: closetRaw } = await sb.from('clothing_items').select('*').order('created_at',{ascending:false});
  const closetItems = closetRaw || [];
  let wornItems = {};
  let catIndex = {}; // cat -> index in itemsOfCat, -1 = "Keins"
  const catItems = {}; // cat -> array of items (only categories that have items)
  let avJewelry = (bp && bp.avatar_jewelry) || {};
  let avTights = (bp && bp.avatar_tights_variant) || 'none';
  const avatarImagePath = bp && bp.avatar_image_path;
  let avatarImageUrl = AVATAR_DEFAULT_IMAGE;
  if(avatarImagePath){ avatarImageUrl = (await signedUrl(avatarImagePath)) || AVATAR_DEFAULT_IMAGE; }

  function drawBase(box){
    if(avatarImageUrl){
      box.appendChild(el(`<img src="${avatarImageUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;">`));
    } else {
      box.appendChild(el(`
        <div style="position:absolute;inset:0;border:1.5px dashed var(--hair);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-soft);background:var(--card);">
          <span style="font-size:34px;">🧍‍♀️</span>
          <span style="font-size:12.5px;text-align:center;padding:0 20px;">Avatar folgt bald – deine Kleidung siehst du hier schon jetzt live.</span>
        </div>`));
    }
  }

  function drawPreview(){
    const box = document.getElementById('av-preview');
    if(!box) return;
    box.innerHTML = "";
    drawBase(box);
    const tightsVariant = TIGHTS_VARIANTS.find(t=>t.id===avTights);
    if(tightsVariant && tightsVariant.image){
      /* Bein-Bild ist bereits exakt auf die Maße/Position von AVATAR_DEFAULT_IMAGE (155x700) ausgerichtet,
         daher wie die Basisfigur selbst mit inset:0 einblenden statt über eine Prozent-Zone. */
      box.appendChild(el(`<img src="${tightsVariant.image}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;">`));
    }
    const earringItem = avJewelry.earrings && jewelryItems.find(j=>j.id===avJewelry.earrings);
    const necklaceItem = avJewelry.necklace && jewelryItems.find(j=>j.id===avJewelry.necklace);
    if(earringItem){
      signedUrl(earringItem.image_path).then(url=>{
        if(!url || !document.getElementById('av-preview')) return;
        box.appendChild(el(`<img src="${url}" style="position:absolute;width:14px;height:14px;object-fit:cover;border-radius:50%;left:32%;top:18%;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px #fff;">`));
        box.appendChild(el(`<img src="${url}" style="position:absolute;width:14px;height:14px;object-fit:cover;border-radius:50%;left:68%;top:18%;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px #fff;">`));
      });
    }
    if(necklaceItem){
      signedUrl(necklaceItem.image_path).then(url=>{
        if(!url || !document.getElementById('av-preview')) return;
        box.appendChild(el(`<img src="${url}" style="position:absolute;width:20px;height:20px;object-fit:cover;border-radius:50%;left:50%;top:27.5%;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px #fff;">`));
      });
    }
    const zoneEntries = Object.entries(wornItems).filter(([,item])=>item).sort((a,b)=>(OUTFIT_ZONES[a[0]].z)-(OUTFIT_ZONES[b[0]].z));
    zoneEntries.forEach(([cat, item])=>{
      const zone = OUTFIT_ZONES[cat];
      signedUrl(item.image_path).then(url=>{
        if(!url || !document.getElementById('av-preview')) return;
        box.appendChild(el(`<img src="${url}" style="position:absolute;left:${zone.left};top:${zone.top};width:${zone.width};height:${zone.height};object-fit:contain;pointer-events:none;">`));
      });
    });
  }

  const tightsSection = document.getElementById('av-tights-sections');
  TIGHTS_VARIANTS.forEach(t=>{
    tightsSection.appendChild(el(`<button data-tv="${t.id}" style="padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:500;border:1.5px solid ${avTights===t.id?'var(--cognac)':'var(--hair)'};background:${avTights===t.id?'var(--cognac)':'var(--card)'};color:${avTights===t.id?'#fff':'var(--ink-soft)'};cursor:pointer;">${t.label}</button>`));
  });
  tightsSection.querySelectorAll('[data-tv]').forEach(b=> b.onclick = ()=>{

      x.style.borderColor = on ? 'var(--cognac)' : 'var(--hair)';
      x.style.background = on ? 'var(--cognac)' : 'var(--card)';
      x.style.color = on ? '#fff' : 'var(--ink-soft)';
    });

    sb.from('body_profile').upsert({ user_id: session.user.id, avatar_tights_variant: avTights, updated_at: new Date().toISOString() });
  });

    jwSections.appendChild(el(`<p class="sub">Noch kein Schmuck gespeichert – füg welchen über „Schmuck" im Home-Menü hinzu.</p>`));
  } else {
    for(const cat of ['earrings','necklace','bracelet','ring','watch']){
      const itemsOfCat = jewelryItems.filter(j=>j.category===cat);
      if(!itemsOfCat.length) continue;
      const secId = 'av-jw-' + cat;
      jwSections.appendChild(el(`<p class="f" style="margin-top:10px;">${JEWELRY_CATEGORY_LABELS[cat]}</p><div id="${secId}" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;"></div>`));
      const row = document.getElementById(secId);
      row.appendChild(el(`<button data-jid="" style="width:44px;height:44px;border-radius:10px;border:1.5px solid ${!avJewelry[cat]?'var(--cognac)':'var(--hair)'};background:var(--card);cursor:pointer;font-size:9.5px;color:var(--ink-soft);">Keins</button>`));
      for(const j of itemsOfCat){
        const url = await signedUrl(j.image_path);
        const on = avJewelry[cat] === j.id;
        row.appendChild(el(`<button data-jid="${j.id}" style="width:44px;height:44px;border-radius:10px;overflow:hidden;border:1.5px solid ${on?'var(--cognac)':'var(--hair)'};padding:0;cursor:pointer;">${url?`<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`:''}</button>`));
      }
      row.querySelectorAll('[data-jid]').forEach(b=> b.onclick = ()=>{
        if(b.dataset.jid) avJewelry[cat] = b.dataset.jid; else delete avJewelry[cat];
        row.querySelectorAll('[data-jid]').forEach(x=> x.style.borderColor = (x.dataset.jid===b.dataset.jid) ? 'var(--cognac)' : 'var(--hair)');
        drawPreview();
        sb.from('body_profile').upsert({ user_id: session.user.id, avatar_jewelry: avJewelry, updated_at: new Date().toISOString() });
      });
    }
  }

  /* ---- Outfit swipe rows ---- */
  const outfitSections = document.getElementById('av-outfit-sections');
  if(!closetItems.length){
    outfitSections.appendChild(el(`<p class="sub">Noch keine Teile im Kleiderschrank – füg welche über „+ Teil" hinzu.</p>`));
  } else {
    for(const cat of OUTFIT_CATEGORIES_ORDER){
      const itemsOfCat = closetItems.filter(i=>i.category===cat);
      if(!itemsOfCat.length) continue;
      catItems[cat] = itemsOfCat;
      catIndex[cat] = -1;
      const urls = await Promise.all(itemsOfCat.map(it=>signedUrl(it.image_path)));
      itemsOfCat.forEach((it,i)=> it._url = urls[i]);
      const secId = 'av-swipe-' + cat.replace(/[^a-zA-Z0-9]/g,'');
      outfitSections.appendChild(el(`
        <div style="margin-top:14px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <p class="f" style="margin:0;">${cat}</p>
            <span id="${secId}-count" style="font-size:11px;color:var(--ink-soft);"></span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
            <button id="${secId}-prev" style="flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--card);cursor:pointer;font-size:15px;color:var(--ink-soft);">‹</button>
            <div id="${secId}-thumb" style="flex:1;height:96px;border-radius:12px;border:1.5px solid var(--hair);background:repeating-conic-gradient(#e7dac7 0% 25%, transparent 0% 50%) 50% / 10px 10px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab;"></div>
            <button id="${secId}-next" style="flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--card);cursor:pointer;font-size:15px;color:var(--ink-soft);">›</button>
            <button id="${secId}-search" title="Alle ${cat} auf einen Blick" style="flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--card);cursor:pointer;font-size:14px;color:var(--ink-soft);">🔍</button>
          </div>
        </div>`));

      function renderSlot(){
        const idx = catIndex[cat];
        const thumb = document.getElementById(secId+'-thumb');
        const count = document.getElementById(secId+'-count');
        if(!thumb) return;
        if(idx === -1){
          thumb.innerHTML = `<span style="font-size:12px;color:var(--ink-soft);">Kein Teil ausgewählt – wischen zum Anprobieren</span>`;
          delete wornItems[cat];
        } else {
          const it = itemsOfCat[idx];
          thumb.innerHTML = it._url ? `<img src="${it._url}" style="width:100%;height:100%;object-fit:contain;pointer-events:none;">` : '';
          wornItems[cat] = it;
        }
        count.textContent = idx === -1 ? `–/${itemsOfCat.length}` : `${idx+1}/${itemsOfCat.length}`;
        drawPreview();
      }
      function step(dir){
        catIndex[cat] = Math.max(-1, Math.min(itemsOfCat.length-1, catIndex[cat]+dir));
        renderSlot();
      }
      function openGridPicker(){
        const overlay = el(`
          <div id="av-grid-overlay" style="position:fixed;inset:0;background:rgba(31,23,18,.55);z-index:999;display:flex;align-items:flex-end;justify-content:center;">
            <div style="background:var(--card);width:100%;max-width:480px;max-height:78vh;border-radius:20px 20px 0 0;padding:16px;overflow-y:auto;box-sizing:border-box;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <p class="f" style="margin:0;">${cat} – alle ${itemsOfCat.length} auf einen Blick</p>
                <button id="av-grid-close" style="border:none;background:none;font-size:20px;line-height:1;color:var(--ink-soft);cursor:pointer;">✕</button>
              </div>
              <div id="av-grid-items" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
            </div>
          </div>`);
        document.body.appendChild(overlay);
        const grid = overlay.querySelector('#av-grid-items');
        grid.appendChild(el(`<button data-gi="-1" style="aspect-ratio:1;border-radius:10px;border:1.5px solid ${catIndex[cat]===-1?'var(--cognac)':'var(--hair)'};background:var(--bg,#faf6f0);cursor:pointer;font-size:11px;color:var(--ink-soft);">Keins</button>`));
        itemsOfCat.forEach((it,i)=>{
          grid.appendChild(el(`<button data-gi="${i}" style="aspect-ratio:1;border-radius:10px;overflow:hidden;border:1.5px solid ${catIndex[cat]===i?'var(--cognac)':'var(--hair)'};padding:0;cursor:pointer;background:var(--bg,#faf6f0);">${it._url?`<img src="${it._url}" style="width:100%;height:100%;object-fit:contain;">`:''}</button>`));
        });
        grid.querySelectorAll('[data-gi]').forEach(b=> b.onclick = ()=>{
          catIndex[cat] = parseInt(b.dataset.gi, 10);
          renderSlot();
          overlay.remove();
        });
        overlay.querySelector('#av-grid-close').onclick = ()=> overlay.remove();
        overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
      }
      document.getElementById(secId+'-prev').onclick = ()=> step(-1);
      document.getElementById(secId+'-next').onclick = ()=> step(1);
      document.getElementById(secId+'-search').onclick = ()=> openGridPicker();
      const thumbEl = document.getElementById(secId+'-thumb');
      let dragStartX = null;
      thumbEl.addEventListener('pointerdown', (e)=>{ dragStartX = e.clientX; thumbEl.setPointerCapture(e.pointerId); });
      thumbEl.addEventListener('pointerup', (e)=>{
        if(dragStartX===null) return;
        const dx = e.clientX - dragStartX;
        dragStartX = null;
        if(Math.abs(dx) > 30) step(dx < 0 ? 1 : -1);
      });
      renderSlot();
    }
  }

  drawPreview();

  /* ---- Komplettes Outfit vorschlagen: einfache erste Version, wählt je Kategorie ein zufälliges Teil.
     Später hier stattdessen einen Aufruf an eine KI-Stylisten-Edge-Function einsetzen. ---- */
  document.getElementById('av-suggest').onclick = ()=>{
    for(const cat of Object.keys(catItems)){
      const items = catItems[cat];
      if(!items.length) continue;
      catIndex[cat] = Math.floor(Math.random()*items.length);
      const thumb = document.getElementById('av-swipe-'+cat.replace(/[^a-zA-Z0-9]/g,'')+'-thumb');
      const count = document.getElementById('av-swipe-'+cat.replace(/[^a-zA-Z0-9]/g,'')+'-count');
      const it = items[catIndex[cat]];
      if(thumb) thumb.innerHTML = it._url ? `<img src="${it._url}" style="width:100%;height:100%;object-fit:contain;pointer-events:none;">` : '';
      if(count) count.textContent = `${catIndex[cat]+1}/${items.length}`;
      wornItems[cat] = it;
    }
    drawPreview();
  };
  document.getElementById('av-clear').onclick = ()=>{
    for(const cat of Object.keys(catItems)){
      catIndex[cat] = -1;
      const thumb = document.getElementById('av-swipe-'+cat.replace(/[^a-zA-Z0-9]/g,'')+'-thumb');
      const count = document.getElementById('av-swipe-'+cat.replace(/[^a-zA-Z0-9]/g,'')+'-count');
      if(thumb) thumb.innerHTML = `<span style="font-size:12px;color:var(--ink-soft);">Kein Teil ausgewählt – wischen zum Anprobieren</span>`;
      if(count) count.textContent = `–/${catItems[cat].length}`;
      delete wornItems[cat];
    }
    drawPreview();
  };
}

async function buildChatContext(){
  const context = {};
  try{
    const { data: items } = await sb.from('clothing_items').select('id,category,subcategory,colors,brand').limit(200);
    if(items) context.closet = items;
    const { data: jewelry } = await sb.from('jewelry_items').select('category,material').limit(100);
    if(jewelry) context.jewelry = jewelry;
    const { data: events } = await sb.from('events').select('title,event_date,event_time,location,dress_code').gte('event_date', new Date().toISOString().slice(0,10)).order('event_date',{ascending:true}).limit(3);
    if(events) context.upcoming_events = events;
    const { data: prefs } = await sb.from('style_preferences').select('statement,rule_type,valid_until').eq('active', true).limit(50);
    if(prefs) context.style_preferences = prefs;
    const weather = await fetchWeather();
    if(weather) context.weather = weather;
    const { data: bp } = await sb.from('body_profile').select('*').eq('user_id', session.user.id).maybeSingle();
    if(bp){
      if(bp.body_shape){
        const shape = BODY_SHAPES.find(s=>s.id===bp.body_shape);
        const build = BODY_BUILDS.find(b=>b.id===bp.body_build);
        if(shape) context.body_shape = { label: shape.label, style_tips: shape.tips, build: build ? build.label : null };
      }
      if(bp.color_season && SEASON_PALETTES[bp.color_season]){
        context.color_type = { season: bp.color_season, ...SEASON_PALETTES[bp.color_season] };
      }
    }
  }catch(e){ console.error('buildChatContext', e); }
  return context;
}

    </div>
  `));
  async function load(){
    const list = document.getElementById('chat-list');
    const { data, error } = await sb.from('chat_messages').select('*').order('created_at',{ascending:true});
    list.innerHTML = "";
    if(error){ list.appendChild(el(`<div class="msg error">${error.message}</div>`)); return; }
    data.forEach(m=>{
      const bubble = m.role === 'user'
        ? `<div style="display:flex;justify-content:flex-end;margin-bottom:8px;"><div class="card" style="background:var(--sand);border:none;max-width:80%;"><p style="margin:0;font-size:13.5px;">${m.content}</p></div></div>`
        : `<div style="display:flex;gap:8px;margin-bottom:8px;"><div style="width:26px;height:26px;border-radius:50%;background:var(--cognac);flex:none;"></div><div class="card" style="max-width:80%;"><p style="margin:0;font-size:13.5px;">${m.content}</p></div></div>`;
      list.appendChild(el(bubble));
    });
    list.scrollIntoView({block:'end'});
  }
  bindBack();
  document.getElementById('chat-send').onclick = async ()=>{
    const input = document.getElementById('chat-input');
    const btn = document.getElementById('chat-send');
    const text = input.value.trim();
    if(!text) return;
    input.value = "";
    btn.disabled = true;
    await sb.from('chat_messages').insert({ user_id: session.user.id, role: 'user', content: text });
    await load();
    try{
      const { data: history } = await sb.from('chat_messages').select('role,content').order('created_at',{ascending:true}).limit(20);
      const messages = (history||[]).map(m=>({ role: m.role, content: m.content }));
      const context = await buildChatContext();
      const { data, error } = await sb.functions.invoke('ai-chat', { body: { messages, context } });
      if(error) throw error;
      if(data && data.error) throw new Error(data.error);
      const reply = (data && data.reply) || 'Entschuldige, mir fällt gerade keine Antwort ein. Magst du es nochmal anders formulieren?';
      await sb.from('chat_messages').insert({ user_id: session.user.id, role: 'assistant', content: reply });
      await load();
      if(data && data.outfit_item_ids && data.outfit_item_ids.length){
        await renderOutfitGrid(data.outfit_item_ids);
      }
    }catch(e){
      console.error('ai-chat', e);
      await sb.from('chat_messages').insert({ user_id: session.user.id, role: 'assistant', content: 'Deine Nachricht ist gespeichert, aber die KI-Antwort ist gerade nicht erreichbar. Versuch es gleich nochmal.' });
      await load();
    }
    btn.disabled = false;
  };
  async function renderOutfitGrid(ids){
    const { data: items } = await sb.from('clothing_items').select('id,image_path,category,subcategory,colors,material,brand').in('id', ids);
    if(!items || !items.length) return;
    const list = document.getElementById('chat-list');
    const gridId = 'outfit-grid-' + Date.now();
    const genId = 'outfit-gen-' + Date.now();
    const wrap = el(`<div class="card" style="margin:0 0 10px;padding:10px;background:var(--sand);border:none;">
      <p class="sub" style="margin:0 0 8px;">Vorschlag aus deinem Kleiderschrank</p>
      <div id="${gridId}" style="display:grid;grid-template-columns:repeat(${Math.min(items.length,3)},1fr);gap:6px;margin-bottom:10px;"></div>
      <button class="btn-secondary" id="${genId}-btn">Als KI-Bild zeigen (Model trägt diese Kombination)</button>
      <div id="${genId}"></div>
    </div>`);
    list.appendChild(wrap);
    const grid = document.getElementById(gridId);
    for(const it of items){
      const url = await signedUrl(it.image_path);
      grid.appendChild(el(`<div class="swatch" style="height:100px;">${url?`<img src="${url}">`:''}<span class="tag" style="font-size:9.5px;padding:2px 6px;">${it.subcategory||it.category||''}</span></div>`));
    }
    document.getElementById(genId+'-btn').onclick = async ()=>{
      const genBox = document.getElementById(genId);
      const btn = document.getElementById(genId+'-btn');
      btn.disabled = true; btn.textContent = "Bild wird generiert…";
      genBox.innerHTML = `<p class="sub" style="margin:8px 0 0;">Das kann einen Moment dauern…</p>`;
      try{
        const { data, error } = await sb.functions.invoke('ai-outfit-image', { body: { items: items.map(it=>({category:it.category,subcategory:it.subcategory,colors:it.colors,material:it.material,brand:it.brand})) } });
        if(error) throw error;
        if(data && data.error) throw new Error(data.error);
        genBox.innerHTML = "";
        genBox.appendChild(el(`<div class="swatch" style="height:320px;margin-top:8px;"><img src="data:image/png;base64,${data.image_base64}"></div>`));
        btn.style.display = 'none';
      }catch(e){
        console.error('ai-outfit-image', e);
        genBox.innerHTML = `<p class="sub" style="margin:8px 0 0;">Bild konnte gerade nicht erstellt werden – versuch's gleich nochmal.</p>`;
        btn.disabled = false; btn.textContent = "Als KI-Bild zeigen (Model trägt diese Kombination)";
      }
    };
    list.scrollIntoView({block:'end'});
  }
  load();
}

async function renderApp(){
  app.innerHTML = "";
  const container = document.createElement('div');
  app.appendChild(container);
  if(currentTab === 'home') await renderHome(container);
  else if(currentTab === 'closet') await renderCloset(container);
  else if(currentTab === 'add') await renderAdd(container);
  else if(currentTab === 'edititem') await renderEditItem(container);
  else if(currentTab === 'calendar') await renderCalendar(container);
  else if(currentTab === 'profile') await renderProfile(container);
  else if(currentTab === 'wishlist') await renderWishlist(container);
  else if(currentTab === 'inspiration') await renderInspiration(container);
  else if(currentTab === 'diary') await renderDiary(container);
  else if(currentTab === 'jewelry') await renderJewelry(container);
  else if(currentTab === 'mystyle') await renderMyStyle(container);
  else if(currentTab === 'avatar') await renderAvatar(container);
  else if(currentTab === 'chat') await renderChat(container);
  app.appendChild(el(navBar()));
  bindNav();
}

async function render(){
  if(!session){ renderAuthView(); return; }
  await renderApp();
}

initAuth();
</script>
</body>
</html>
